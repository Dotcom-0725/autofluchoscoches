/* ================= SETTINGS ================= */
function renderSettings(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="tabs">
      <button data-stab="seo" class="active">SEO</button>
      <button data-stab="contact">Coordonnées</button>
      <button data-stab="roles">Rôles admin</button>
      <button data-stab="log">Journal d'activité</button>
      <button data-stab="backup">Sauvegardes</button>
    </div>
    <div id="settingsTabBody"></div>
  `;
  root.querySelectorAll('[data-stab]').forEach(b=> b.addEventListener('click', ()=>{
    root.querySelectorAll('[data-stab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderSettingsTab(b.dataset.stab);
  }));
  renderSettingsTab('seo');
}
function renderSettingsTab(tab){
  const el = document.getElementById('settingsTabBody');
  if(tab === 'seo'){
    el.innerHTML = `
      <div class="section-note">Ceci remplace le titre/description meta que le site en ligne affiche à Google et aux aperçus sur les réseaux sociaux — appliqué en temps réel, aucune modification du code nécessaire.</div>
      <div class="card card-pad">
        <div class="field"><label>Titre meta</label><input id="seoTitle" value="${state.settings.meta_title||''}" placeholder="Laissez vide pour garder le titre par défaut du site"></div>
        <div class="field"><label>Description meta</label><textarea id="seoDesc" rows="3" placeholder="Laissez vide pour garder la description par défaut du site">${state.settings.meta_description||''}</textarea></div>
        <div class="field"><label>Type d'entreprise Schema.org</label><input value="AutoRental" disabled>
          <span style="font-size:.72rem;color:var(--ink-dim)">Les données structurées sont définies dans le bloc JSON-LD d'index.html — modifiez le code directement pour des changements structurels (ce tableau de bord ne remplace que le texte du titre/description).</span>
        </div>
        ${isEditor() ? `<button class="btn btn-primary" id="seoSave">Enregistrer les paramètres SEO</button>` : ''}
      </div>
    `;
    if(isEditor()){
      document.getElementById('seoSave').addEventListener('click', async ()=>{
        await apiPost({ action:'saveSetting', key:'meta_title', value: document.getElementById('seoTitle').value });
        await apiPost({ action:'saveSetting', key:'meta_description', value: document.getElementById('seoDesc').value });
        toast('Paramètres SEO enregistrés');
        await refreshAdminData();
      });
    }
  } else if(tab === 'contact'){
    el.innerHTML = `
      <div class="section-note">Ceci remplace le téléphone, l'e-mail et l'adresse affichés partout sur le site (en-tête, section Contact, pied de page, boutons WhatsApp, PDF de réservation) — appliqué en temps réel, aucune modification du code nécessaire.</div>
      <div class="card card-pad">
        <div class="field"><label>Téléphone (avec indicatif pays, ex. +212 661-304574)</label><input id="contactPhone" value="${esc(state.settings.contact_phone)||''}" placeholder="Laissez vide pour garder le téléphone par défaut du site"></div>
        <div class="field"><label>E-mail</label><input id="contactEmail" type="email" value="${esc(state.settings.contact_email)||''}" placeholder="Laissez vide pour garder l'e-mail par défaut du site"></div>
        <div class="field"><label>Adresse</label><input id="contactAddress" value="${esc(state.settings.contact_address)||''}" placeholder="Laissez vide pour garder l'adresse par défaut du site"></div>
        ${isEditor() ? `<button class="btn btn-primary" id="contactSave">Enregistrer les coordonnées</button>` : ''}
      </div>
    `;
    if(isEditor()){
      document.getElementById('contactSave').addEventListener('click', async ()=>{
        await apiPost({ action:'saveSetting', key:'contact_phone', value: document.getElementById('contactPhone').value.trim() });
        await apiPost({ action:'saveSetting', key:'contact_email', value: document.getElementById('contactEmail').value.trim() });
        await apiPost({ action:'saveSetting', key:'contact_address', value: document.getElementById('contactAddress').value.trim() });
        toast('Coordonnées enregistrées');
        await refreshAdminData();
      });
    }
  } else if(tab === 'roles'){
    el.innerHTML = `
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Rôle</th><th>Peut faire</th></tr></thead>
        <tbody>
          <tr><td><span class="pill pill-blue">Super Admin</span></td><td>Accès complet à tous les modules. Actuellement le seul rôle utilisé — un mot de passe partagé pour toute l'équipe.</td></tr>
        </tbody>
      </table></div>
      <div class="card-pad" style="color:var(--ink-dim);font-size:.8rem">Le code du tableau de bord permet encore de séparer ceci en rôles distincts Gérant/Employé avec un accès restreint plus tard — ajoutez simplement d'autres entrées à ADMIN_ROLES_JSON (Script Properties) dans le backend si besoin.</div>
      </div>
      <div class="card card-pad" style="margin-top:20px">
        <h3 style="margin-top:0">Changer le mot de passe</h3>
        <div class="section-note">Le nouveau mot de passe prend effet immédiatement, sans redéploiement du backend — mais toute autre personne de l'équipe utilisant l'ancien mot de passe devra recevoir le nouveau.</div>
        <div class="field"><label>Mot de passe actuel</label><input type="password" id="pwCurrent" autocomplete="current-password"></div>
        <div class="field"><label>Nouveau mot de passe (8 caractères minimum)</label><input type="password" id="pwNew" autocomplete="new-password"></div>
        <div class="field"><label>Confirmer le nouveau mot de passe</label><input type="password" id="pwConfirm" autocomplete="new-password"></div>
        <button class="btn btn-primary" id="pwSave">Changer le mot de passe</button>
      </div>
    `;
    document.getElementById('pwSave').addEventListener('click', async ()=>{
      const current = document.getElementById('pwCurrent').value;
      const next = document.getElementById('pwNew').value;
      const confirm = document.getElementById('pwConfirm').value;
      if(!current || !next){ toast('Veuillez remplir tous les champs'); return; }
      if(next.length < 8){ toast('Le nouveau mot de passe doit contenir au moins 8 caractères'); return; }
      if(next !== confirm){ toast('Les deux mots de passe ne correspondent pas'); return; }
      const btn = document.getElementById('pwSave');
      btn.disabled = true;
      // apiPost() already sends state.password as the request's "password"
      // field — but that's the SESSION password, which the admin may be
      // deliberately changing away from right now, so send the "current
      // password" field the admin just typed explicitly instead, in case
      // it differs (e.g. they mistyped, or session/state briefly drifted).
      const r = await apiPost({ action: 'changePassword', password: current, newPassword: next });
      btn.disabled = false;
      if(r.success){
        state.password = next;
        try { sessionStorage.setItem('afc_admin_pw', next); } catch(e){}
        document.getElementById('pwCurrent').value = '';
        document.getElementById('pwNew').value = '';
        document.getElementById('pwConfirm').value = '';
        toast('Mot de passe changé avec succès');
      } else {
        toast(r.error === 'Wrong password' ? 'Mot de passe actuel incorrect' : (r.error || 'Échec'));
      }
    });
  } else if(tab === 'log'){
    el.innerHTML = `
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Quand</th><th>Rôle</th><th>Action</th><th>Détails</th></tr></thead>
        <tbody>${state.activityLog.map(l=>`<tr><td>${fmtDate(l.timestamp)}</td><td><span class="pill pill-gray">${esc(l.role)}</span></td><td>${esc(l.action)}</td><td>${esc(l.details)||''}</td></tr>`).join('')
          || `<tr><td colspan="4" class="empty-state">Aucune activité enregistrée pour le moment.</td></tr>`}</tbody>
      </table></div></div>
    `;
  } else {
    el.innerHTML = `
      <div class="section-note">Exports en un clic de vos données actuelles — une alternative simple et fiable aux sauvegardes serveur planifiées.</div>
      <div class="card card-pad tag-row">
        <button class="btn btn-outline" id="bkCars">⬇ Exporter les voitures (CSV)</button>
        <button class="btn btn-outline" id="bkBookings">⬇ Exporter les réservations (CSV)</button>
        <button class="btn btn-outline" id="bkSeasons">⬇ Exporter les saisons (CSV)</button>
        <button class="btn btn-primary" id="bkAll">⬇ Sauvegarde complète (JSON)</button>
      </div>
    `;
    document.getElementById('bkCars').addEventListener('click', ()=> csvDownload('cars-backup.csv', state.cars.map(c=>({...c, body:(c.body||[]).join(',')}))));
    document.getElementById('bkBookings').addEventListener('click', ()=> csvDownload('bookings-backup.csv', state.bookings));
    document.getElementById('bkSeasons').addEventListener('click', ()=> csvDownload('seasons-backup.csv', state.seasons));
    document.getElementById('bkAll').addEventListener('click', ()=> jsonDownload('afc-full-backup-' + new Date().toISOString().slice(0,10) + '.json', state));
  }
}
</script>
</body>
</html>
