<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Auto Fluchos Coches</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --sidebar:#14161a; --sidebar-text:#a7acb8; --sidebar-text-active:#fff;
  --card:#ffffff; --card-border:#e5e7eb; --ink:#14161a; --ink-dim:#6b7280;
  --accent:#1f6feb; --accent-dim:rgba(31,111,235,.1); --gold:#c8860d;
  --danger:#e5484d; --success:#12a150; --warn:#c8860d;
  --radius:10px; --font:'Inter',sans-serif;
  --shadow:0 1px 2px rgba(20,24,43,.04), 0 1px 6px rgba(20,24,43,.04);
}
:root[data-theme="dark"]{
  --bg:#0b0d10; --sidebar:#0b0d10; --sidebar-text:#8b92a3; --sidebar-text-active:#fff;
  --card:#15181d; --card-border:#262b33; --ink:#eef1f6; --ink-dim:#8b92a3;
  --accent:#3b82f6; --accent-dim:rgba(59,130,246,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --sidebar:#0b0d10; --sidebar-text:#8b92a3; --sidebar-text-active:#fff;
    --card:#15181d; --card-border:#262b33; --ink:#eef1f6; --ink-dim:#8b92a3;
    --accent:#3b82f6; --accent-dim:rgba(59,130,246,.15);
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.85rem}

/* ---- Login screen ---- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:40px;width:360px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.3rem;margin:0 0 4px}
.login-card p{color:var(--ink-dim);font-size:.85rem;margin:0 0 24px}
.login-card input{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--card-border);background:var(--bg);color:var(--ink);margin-bottom:14px}
.login-card button{width:100%;padding:11px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:700}
.login-error{color:var(--danger);font-size:.8rem;margin:-6px 0 12px;display:none}
.login-error.show{display:block}

/* ---- App shell ---- */
#app{display:none;min-height:100vh}
#app.ready{display:flex}
.sidebar{width:230px;flex:0 0 230px;background:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;padding:20px 0}
.sidebar-brand{padding:0 20px 20px;font-weight:800;color:#fff;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.sidebar-brand small{display:block;font-weight:500;font-size:.68rem;color:var(--sidebar-text);margin-top:2px}
.nav-list{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto}
.nav-list li button{
  width:100%;text-align:left;background:none;border:none;color:var(--sidebar-text);
  padding:10px 20px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:10px;
}
.nav-list li button:hover{color:#fff}
.nav-list li button.active{color:var(--sidebar-text-active);background:rgba(255,255,255,.06);border-inline-start:3px solid var(--accent)}
.sidebar-footer{padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.role-badge{font-size:.68rem;font-weight:700;color:#fff;background:var(--accent);display:inline-block;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;width:fit-content}
.sidebar-footer button{background:none;border:1px solid rgba(255,255,255,.15);color:var(--sidebar-text);border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:600}
.sidebar-footer button:hover{color:#fff}

main{flex:1;min-width:0;padding:28px 34px;max-width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.topbar h2{margin:0;font-size:1.35rem}
.topbar .sub{color:var(--ink-dim);font-size:.82rem;margin-top:2px}
.topbar-title-row{display:flex;align-items:center;gap:12px}
.sidebar-toggle-btn{display:none;background:none;border:1px solid var(--card-border);color:var(--ink);border-radius:8px;width:38px;height:38px;font-size:1.1rem;align-items:center;justify-content:center;flex:0 0 auto}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:150}
.sidebar-backdrop.open{display:block}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:20px}
.card-pad{padding:20px 22px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);font-weight:700}
.kpi .value{font-size:1.7rem;font-weight:800;margin-top:6px}
.kpi .sub{font-size:.76rem;color:var(--ink-dim);margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;color:var(--ink-dim);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--card-border)}
td{padding:11px 14px;border-bottom:1px solid var(--card-border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}

.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--card-border);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:.74rem;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:700}
.pill-blue{background:var(--accent-dim);color:var(--accent)}
.pill-green{background:rgba(18,161,80,.12);color:var(--success)}
.pill-red{background:rgba(229,72,77,.12);color:var(--danger)}
.pill-gray{background:rgba(107,114,128,.12);color:var(--ink-dim)}
.payment-status-select{
  padding:5px 8px;border-radius:7px;border:1px solid var(--card-border);
  background:var(--card);color:var(--ink);font-size:.76rem;font-weight:600;
}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:.72rem;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{padding:9px 12px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg);color:var(--ink)}
.field-check{flex-direction:row;align-items:center;gap:8px}

.modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px}
.modal-box h3{margin:0 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* Custom calendar popup for the manual-reservation Pickup/Return fields —
   mirrors the customer-facing site's picker (same booked-day shading logic,
   fed from the same live bookings data) so the admin sees exactly the same
   availability the website would show, preventing any mismatch between
   manual and online reservations for the same vehicle. */
.custom-datepicker{
  position:absolute;z-index:900;background:var(--card);border:1px solid var(--card-border);
  border-radius:14px;box-shadow:var(--shadow);padding:14px;width:266px;
}
.custom-datepicker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.custom-datepicker-header .cdp-label{font-weight:800;font-size:.88rem}
.custom-datepicker-header button{
  background:var(--bg);border:1px solid var(--card-border);color:var(--ink);
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.85rem;line-height:1;
}
.custom-datepicker-header button:hover{border-color:var(--accent);color:var(--accent)}
.custom-datepicker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.custom-datepicker-grid .cdp-dow{color:var(--ink-dim);font-weight:700;font-size:.68rem;padding:4px 0;text-transform:uppercase}
.custom-datepicker-grid button{
  background:none;border:none;padding:7px 0;border-radius:8px;cursor:pointer;color:var(--ink);font-size:.8rem;
}
.custom-datepicker-grid button:hover:not(:disabled){background:var(--bg)}
.custom-datepicker-grid button.cdp-selected{background:var(--accent);color:#fff;font-weight:700}
.custom-datepicker-grid button.cdp-other-month{color:var(--ink-dim);opacity:.4}
.custom-datepicker-grid button:disabled{opacity:.25;cursor:not-allowed}
.custom-datepicker-grid button.cdp-booked{
  background:rgba(230,57,80,.12);color:#c81e3a;text-decoration:line-through;
  opacity:1;cursor:not-allowed;
}
.custom-datepicker-grid button.cdp-booked:hover{background:rgba(230,57,80,.12)}
.custom-datepicker-grid button.cdp-booked.cdp-other-month{opacity:.35}
.custom-datepicker-time{
  display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--card-border);
}
.custom-datepicker-time input{
  flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--card-border);
  background:var(--bg);color:var(--ink);font-size:.82rem;
}
.custom-datepicker-done{
  width:100%;margin-top:12px;padding:8px;border-radius:9px;border:none;
  background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;cursor:pointer;
}
input[data-custom-picker]{cursor:pointer}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-dim)}
.section-note{background:var(--accent-dim);color:var(--accent);border-radius:8px;padding:10px 14px;font-size:.78rem;margin-bottom:16px}
.section-note.warn{background:rgba(200,134,13,.12);color:var(--warn)}
.toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--card-border)}
.tabs button{background:none;border:none;padding:9px 4px;margin-inline-end:20px;font-weight:700;color:var(--ink-dim);border-bottom:2px solid transparent;font-size:.82rem}
.tabs button.active{color:var(--accent);border-color:var(--accent)}
.thumb{width:56px;height:40px;object-fit:cover;border-radius:6px;background:var(--bg)}
.drag-handle{cursor:grab;color:var(--ink-dim)}
tr.dragging{opacity:.4}
.toast{position:fixed;bottom:20px;inset-inline-end:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:9px;font-size:.82rem;font-weight:600;z-index:900;box-shadow:var(--shadow)}
@media (max-width:900px){
  .sidebar{position:fixed;z-index:200;top:0;left:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle-btn{display:flex}
  main{padding:20px;width:100%}
  .field-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>Auto Fluchos Coches</h1>
    <p>Admin Dashboard — sign in with your admin password.</p>
    <input type="password" id="loginPassword" placeholder="Password" autofocus required>
    <p class="login-error" id="loginError">Wrong password.</p>
    <button type="submit" id="loginSubmitBtn">Sign in</button>
  </form>
</div>

<div id="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">AUTO FLUCHOS <span style="color:#5b9bff">COCHES</span><small>ADMIN DASHBOARD</small></div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <span class="role-badge" id="roleBadge">—</span>
      <button type="button" id="darkModeToggle">🌙 Dark mode</button>
      <button type="button" id="logoutBtn">Log out</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="topbar-title-row">
        <button type="button" id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Menu">☰</button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <div class="sub" id="pageSub"></div>
        </div>
      </div>
      <a href="index.html" class="btn btn-outline" target="_blank">View live site ↗</a>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKZk3f58C67EZArO4uLRSu7chg3soBBgIBQYNOq3-NXUkoZ0--82S5NgS7ccWbiuOi/exec';

const state = { password: null, role: null, cars: [], bookings: [], seasons: [], settings: {}, activityLog: [], fleetUnits: [] };

const NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: '📊' },
  { id: 'fleet', label: 'Fleet Management', icon: '🚗' },
  { id: 'inventory', label: 'Inventory', icon: '📦' },
  { id: 'reservations', label: 'Reservations', icon: '📋' },
  { id: 'calendar', label: 'Calendar', icon: '📅' },
  { id: 'customers', label: 'Customers', icon: '👥' },
  { id: 'pricing', label: 'Pricing', icon: '💶' },
  { id: 'categories', label: 'Categories', icon: '🏷️' },
  { id: 'reports', label: 'Reports', icon: '📈' },
  { id: 'notifications', label: 'Notifications', icon: '🔔' },
  { id: 'settings', label: 'Settings', icon: '⚙️' },
];
const EDITOR_ROLES = ['super_admin', 'manager'];
let currentView = 'dashboard';

/* ---------------- API helpers ---------------- */
async function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(APPS_SCRIPT_URL + '?' + qs);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ password: state.password }, body)),
  });
  return res.json();
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function isEditor(){ return EDITOR_ROLES.includes(state.role); }
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d)) return String(v).slice(0,16).replace('T',' ');
  return d.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function csvDownload(filename, rows){
  if(!rows.length){ toast('Nothing to export'); return; }
  const cols = Object.keys(rows[0]);
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function jsonDownload(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ---------------- Auth ---------------- */
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmitBtn');
  errorEl.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';

  // A network/CORS failure (blocked request, ad-blocker, offline, etc.) throws
  // before ever reaching the server — that is NOT the same as a wrong password,
  // so retry once automatically, then show an accurate message either way
  // instead of a misleading "Wrong password".
  let result = await apiGetAdmin(password);
  if(result.networkError) result = await apiGetAdmin(password);

  submitBtn.disabled = false;
  submitBtn.textContent = 'Sign in';

  if(result.networkError){
    errorEl.textContent = "Couldn't reach the server — this isn't a wrong password. Check your internet connection, or disable any ad-blocker/privacy extension for this site (some block Google Apps Script URLs), then try again.";
    errorEl.classList.add('show');
    return;
  }
  if(!result.data || !result.data.success){
    errorEl.textContent = 'Wrong password.';
    errorEl.classList.add('show');
    return;
  }
  state.password = password;
  applyAdminData(result.data);
  try { sessionStorage.setItem('afc_admin_pw', password); } catch(e){}
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('ready');
  buildSidebar();
  navigate('dashboard');
});
async function apiGetAdmin(password){
  try { return { data: await apiGet({ action: 'admin', password }) }; }
  catch(e){ return { networkError: true }; }
}
function applyAdminData(data){
  state.role = data.role;
  state.cars = data.cars || [];
  state.bookings = data.bookings || [];
  state.seasons = data.seasons || [];
  state.settings = data.settings || {};
  state.activityLog = data.activityLog || [];
  state.fleetUnits = data.fleetUnits || [];
}
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  try { sessionStorage.removeItem('afc_admin_pw'); } catch(e){}
  location.reload();
});

/* Auto-login if a password is already stored in this tab's session */
(async ()=>{
  let saved = null;
  try { saved = sessionStorage.getItem('afc_admin_pw'); } catch(e){}
  if(!saved) return;
  let result = await apiGetAdmin(saved);
  if(result.networkError) result = await apiGetAdmin(saved);
  if(result.data && result.data.success){
    state.password = saved;
    applyAdminData(result.data);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    buildSidebar();
    navigate('dashboard');
  }
})();

async function refreshAdminData(){
  const result = await apiGetAdmin(state.password);
  if(result.data && result.data.success) applyAdminData(result.data);
  else if(result.networkError) toast("Couldn't refresh — connection issue, showing last-loaded data.");
}

/* ---------------- Dark mode ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('afc_admin_theme', t); } catch(e){}
}
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('afc_admin_theme'); } catch(e){}
  if(saved) applyTheme(saved);
})();
document.getElementById('darkModeToggle').addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

/* ---------------- Mobile sidebar toggle ---------------- */
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}
document.getElementById('sidebarToggle').addEventListener('click', ()=>{
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

/* ---------------- Sidebar / navigation ---------------- */
function buildSidebar(){
  const list = document.getElementById('navList');
  list.innerHTML = NAV.map(n => `<li><button data-view="${n.id}">${n.icon} ${n.label}</button></li>`).join('');
  list.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=> navigate(b.dataset.view));
  });
  document.getElementById('roleBadge').textContent = state.role.replace('_',' ');
}
const VIEW_TITLES = {
  dashboard: ['Dashboard', 'Overview of your rental business'],
  fleet: ['Fleet Management', 'Create, edit and manage your vehicles'],
  inventory: ['Inventory', 'Stock levels + internal fleet registry (nicknames, plates, VIN, status)'],
  reservations: ['Reservations', 'All bookings — website and manual'],
  calendar: ['Calendar', 'Bookings by date'],
  customers: ['Customers', 'Built from your booking history'],
  pricing: ['Pricing', 'Seasonal pricing and currency'],
  categories: ['Categories', 'Fleet filter tags'],
  reports: ['Reports', 'Bookings, revenue, occupancy'],
  notifications: ['Notifications', 'How you get notified of new bookings'],
  settings: ['Settings', 'SEO, roles, activity log, backups'],
};
function navigate(view){
  currentView = view;
  closeSidebar();
  document.querySelectorAll('#navList button').forEach(b=>b.classList.toggle('active', b.dataset.view === view));
  const [title, sub] = VIEW_TITLES[view];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;
  const renderers = {
    dashboard: renderDashboard, fleet: renderFleet, inventory: renderInventory,
    reservations: renderReservations, calendar: renderCalendar, customers: renderCustomers,
    pricing: renderPricing, categories: renderCategories, reports: renderReports,
    notifications: renderNotifications, settings: renderSettings,
  };
  (renderers[view] || renderDashboard)();
}

/* ---------------- Shared helpers ---------------- */
function bookingStatus(b){
  const now = new Date();
  const ret = new Date(b.ret);
  const pickup = new Date(b.pickup);
  if(ret < now) return { label: 'Overdue', cls: 'pill-red' };
  if(pickup <= now && now <= ret) return { label: 'Active', cls: 'pill-green' };
  return { label: 'Upcoming', cls: 'pill-blue' };
}
function carById(id){ return state.cars.find(c => c.id === id); }
function remainingStock(car){
  const booked = state.bookings.filter(b => b.carId === car.id).length;
  return Math.max(0, (Number(car.stock) || 1) - booked);
}

// Mandatory turnaround time between one booking's return and the next
// booking's pickup for the SAME car — mirrors the backend's
// CAR_TURNAROUND_BUFFER_MS exactly (see apps-script.gs.txt), so the admin
// dashboard never disagrees with what the backend will actually enforce.
const CAR_TURNAROUND_BUFFER_MS_ADMIN = 2 * 60 * 60 * 1000;
/* True if [startA,endA) conflicts with [startB,endB) once the mandatory
   CAR_TURNAROUND_BUFFER_MS_ADMIN gap is required between one range's end and
   the other's start — same interval-overlap test the website's booking
   engine uses, so "is this car free for these dates" agrees exactly between
   the admin dashboard and the public site. */
function rangesOverlapAdmin(startA, endA, startB, endB){
  return new Date(startB).getTime() < new Date(endA).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN &&
         new Date(startA).getTime() < new Date(endB).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN;
}
function getOverlapCountAdmin(carId, pickupVal, retVal){
  return state.bookings.filter(b => b.carId === carId && rangesOverlapAdmin(pickupVal, retVal, b.pickup, b.ret)).length;
}
/* True if this car has NO valid moment left to pick on this calendar day —
   i.e. every unit is still busy (accounting for the turnaround buffer) even
   in the very last minute of the day. Checking only that last instant
   (instead of the whole day) matters: a car whose only booking returns at
   10:00 becomes free again at 12:00 (after the 2h buffer), so the customer
   must still be able to pick THIS day with a later time — the day itself
   must not be disabled just because part of it was booked.
   When this car has real units registered (plate/fleet ID, entered in the
   Inventory > Fleet Units screen), the admin already has full visibility into
   which unit each booking is assigned to (state.bookings[].unitId) — so
   shading here can be EXACT: the day is only fully booked once every
   registered unit is still busy at that last instant, not just a bare count.
   Cars with no units registered yet fall back to the old count-vs-stock check. */
function isDayFullyBookedAdmin(carId, cellDate, excludeRow){
  const car = carById(carId);
  if(!car) return false;
  const dayEnd = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate() + 1);
  const lastInstantStart = new Date(dayEnd.getTime() - 60000); // last minute of the day
  const bookingsPool = excludeRow ? state.bookings.filter(b => b.row !== excludeRow) : state.bookings;
  const units = state.fleetUnits.filter(u => u.carId === carId);
  if(units.length > 0){
    const dayOverlap = bookingsPool.filter(b => b.carId === carId && rangesOverlapAdmin(lastInstantStart.toISOString(), dayEnd.toISOString(), b.pickup, b.ret));
    // Bookings with no unitId (e.g. made before this car had units registered)
    // still occupy a real car — each one must still claim a free slot, or a
    // car with older unassigned bookings would wrongly look fully free.
    const assignedUnitIds = dayOverlap.filter(b => b.unitId).map(b => b.unitId);
    const legacyCount = dayOverlap.filter(b => !b.unitId).length;
    const freeUnits = units.filter(u => assignedUnitIds.indexOf(u.unitId) === -1);
    return freeUnits.length <= legacyCount;
  }
  const overlap = bookingsPool.filter(b => b.carId === carId && rangesOverlapAdmin(lastInstantStart.toISOString(), dayEnd.toISOString(), b.pickup, b.ret)).length;
  return overlap >= (Number(car.stock) || 1);
}

/* ================= CUSTOM DATE PICKER (manual reservation modal) =================
   Mirrors the customer-facing site's calendar popup — same booked-day shading,
   fed from the same state.bookings data — so admins see exactly the same
   availability a website visitor would see for that vehicle. */
const ADMIN_MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ADMIN_WEEKDAY_MIN = ['Su','Mo','Tu','We','Th','Fr','Sa'];
let activeAdminDatePicker = null;
function closeAdminDatePicker(){ if(activeAdminDatePicker){ activeAdminDatePicker.remove(); activeAdminDatePicker = null; } }
document.addEventListener('click', e=>{
  if(activeAdminDatePicker && !activeAdminDatePicker.contains(e.target) && !e.target.closest('input[data-custom-picker]')){
    closeAdminDatePicker();
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeAdminDatePicker(); });
function parseAdminDateValue(input){
  const v = input.value;
  if(v){
    const [datePart, timePart] = v.split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    return { date: new Date(y, m - 1, d), time: timePart || '10:00' };
  }
  return { date: new Date(), time: '10:00' };
}
function writeAdminDateValue(input, date, time){
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  input.value = `${dateStr}T${time}`;
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
/* The earliest bookable time on `cellDate` for `carId`, accounting for the
   mandatory CAR_TURNAROUND_BUFFER_MS_ADMIN after any booking's return — e.g.
   a car returning at 10:00 with a 2h buffer becomes bookable at 12:00 THAT
   SAME DAY. Mirrors index.html's getEarliestAvailableTimeOnDay exactly, but
   reads state.bookings (already fully loaded in the admin dashboard) instead
   of the public site's remoteBookedIntervals. */
function getEarliestAvailableTimeOnDayAdmin(carId, cellDate, excludeRow){
  const dayStart = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  const car = carById(carId);
  if(!car) return dayStart;
  const stock = Number(car.stock) || 1;
  const bookingsPool = (excludeRow ? state.bookings.filter(b => b.row !== excludeRow) : state.bookings)
    .filter(b => b.carId === carId);
  const events = bookingsPool
    .map(b => ({ start: new Date(b.pickup).getTime(), end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN }))
    .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
  const candidates = [dayStart.getTime(), ...events.map(iv => iv.end).filter(t => t > dayStart.getTime() && t < dayEnd.getTime())];
  candidates.sort((a, b) => a - b);
  for(const t of candidates){
    const activeCount = events.filter(iv => iv.start <= t && t < iv.end).length;
    if(activeCount < stock) return new Date(t);
  }
  return dayStart;
}
function openAdminDatePicker(input, carId, excludeRow){
  closeAdminDatePicker();
  const { date: selected, time: initialTime } = parseAdminDateValue(input);
  let viewYear = selected.getFullYear();
  let viewMonth = selected.getMonth();
  let currentTime = initialTime;

  const popup = document.createElement('div');
  popup.className = 'custom-datepicker';
  document.body.appendChild(popup);
  activeAdminDatePicker = popup;

  function render(){
    popup.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'custom-datepicker-header';
    const prevBtn = document.createElement('button');
    prevBtn.type = 'button'; prevBtn.textContent = '‹';
    const label = document.createElement('span');
    label.className = 'cdp-label';
    label.textContent = `${ADMIN_MONTH_NAMES[viewMonth]} ${viewYear}`;
    const nextBtn = document.createElement('button');
    nextBtn.type = 'button'; nextBtn.textContent = '›';
    header.appendChild(prevBtn); header.appendChild(label); header.appendChild(nextBtn);
    popup.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'custom-datepicker-grid';
    ADMIN_WEEKDAY_MIN.forEach(dow=>{
      const el = document.createElement('div');
      el.className = 'cdp-dow';
      el.textContent = dow;
      grid.appendChild(el);
    });
    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(viewYear, viewMonth, 1 - startOffset);
    for(let i = 0; i < 42; i++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = cellDate.getDate();
      if(cellDate.getMonth() !== viewMonth) btn.classList.add('cdp-other-month');
      if(cellDate.toDateString() === selected.toDateString()) btn.classList.add('cdp-selected');
      if(carId && isDayFullyBookedAdmin(carId, cellDate, excludeRow)){
        btn.classList.add('cdp-booked');
        btn.disabled = true;
        btn.title = 'Fully booked for this vehicle';
      }
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        let timeToUse = currentTime || '10:00';
        // Picking the pickup day auto-suggests the earliest moment THAT DAY
        // the car is actually free (its last return + the mandatory
        // turnaround buffer), matching the website's own booking form,
        // instead of a generic default time that would just get rejected.
        if(carId && (input.id === 'mbPickup' || input.id === 'ebPickup')){
          const earliest = getEarliestAvailableTimeOnDayAdmin(carId, cellDate, excludeRow);
          const pad = n => String(n).padStart(2, '0');
          timeToUse = `${pad(earliest.getHours())}:${pad(earliest.getMinutes())}`;
          currentTime = timeToUse;
        }
        writeAdminDateValue(input, cellDate, timeToUse);
        selected.setFullYear(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
        render();
      });
      grid.appendChild(btn);
    }
    popup.appendChild(grid);

    const timeRow = document.createElement('div');
    timeRow.className = 'custom-datepicker-time';
    const timeInput = document.createElement('input');
    timeInput.type = 'time';
    timeInput.value = currentTime || '10:00';
    timeInput.addEventListener('change', ()=>{
      currentTime = timeInput.value;
      writeAdminDateValue(input, selected, currentTime);
    });
    timeRow.appendChild(timeInput);
    popup.appendChild(timeRow);

    const doneBtn = document.createElement('button');
    doneBtn.type = 'button';
    doneBtn.className = 'custom-datepicker-done';
    doneBtn.textContent = 'Done';
    doneBtn.addEventListener('click', closeAdminDatePicker);
    popup.appendChild(doneBtn);

    prevBtn.addEventListener('click', e=>{ e.stopPropagation(); viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } render(); });
    nextBtn.addEventListener('click', e=>{ e.stopPropagation(); viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } render(); });
  }
  render();

  const rect = input.getBoundingClientRect();
  const top = window.scrollY + rect.bottom + 6;
  let left = window.scrollX + rect.left;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 280;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const totalCars = state.cars.length;
  const totalStock = state.cars.reduce((s,c)=> s + (Number(c.stock)||1), 0);
  const activeBookings = state.bookings.length;
  const revenue = state.bookings.reduce((s,b)=> s + (parseFloat(b.total) || 0), 0);
  const occupancy = totalStock > 0 ? Math.round((activeBookings / totalStock) * 100) : 0;
  const popularity = {};
  state.bookings.forEach(b => { popularity[b.carId] = (popularity[b.carId]||0) + 1; });
  const popularId = Object.keys(popularity).sort((a,b)=>popularity[b]-popularity[a])[0];
  const popularCar = popularId ? carById(popularId) : null;

  const upcoming = [...state.bookings].sort((a,b)=> new Date(a.pickup) - new Date(b.pickup)).slice(0, 6);

  document.getElementById('viewRoot').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Active bookings</div><div class="value">${activeBookings}</div><div class="sub">across ${totalCars} models</div></div>
      <div class="kpi"><div class="label">Estimated revenue</div><div class="value">€${revenue.toFixed(0)}</div><div class="sub">sum of active booking totals</div></div>
      <div class="kpi"><div class="label">Fleet occupancy</div><div class="value">${occupancy}%</div><div class="sub">${activeBookings} of ${totalStock} units booked</div></div>
      <div class="kpi"><div class="label">Most popular car</div><div class="value" style="font-size:1.05rem">${popularCar ? popularCar.name : '—'}</div><div class="sub">${popularId ? popularity[popularId] + ' bookings' : 'No bookings yet'}</div></div>
    </div>
    <div class="card">
      <div class="card-pad">
        <div class="toolbar-row"><b>Upcoming pickups &amp; returns</b></div>
        <div class="table-wrap">
        <table>
          <thead><tr><th>Customer</th><th>Vehicle</th><th>Pickup</th><th>Return</th><th>Status</th><th>Source</th></tr></thead>
          <tbody>
            ${upcoming.length ? upcoming.map(b=>{
              const st = bookingStatus(b);
              return `<tr><td>${b.customerName||'—'}</td><td>${b.carName||'—'}</td><td>${fmtDate(b.pickup)}</td><td>${fmtDate(b.ret)}</td><td><span class="pill ${st.cls}">${st.label}</span></td><td><span class="pill pill-gray">${b.source||'website'}</span></td></tr>`;
            }).join('') : `<tr><td colspan="6" class="empty-state">No bookings yet.</td></tr>`}
          </tbody>
        </table>
        </div>
      </div>
    </div>
  `;
}

  renderFleetRows();

function renderFleetRows(){
  const tbody = document.getElementById('fleetTableBody');
  const sorted = [...state.cars].sort((a,b)=> (a.sortOrder??0) - (b.sortOrder??0));
  tbody.innerHTML = sorted.map(c => `
    <tr data-id="${c.id}" ${isEditor() ? 'draggable="true"' : ''}>
      ${isEditor() ? `<td class="drag-handle">⠿</td>` : ''}
      <td>${c.imgSrc ? `<img class="thumb" src="${c.imgSrc}">` : '—'}</td>
      <td><b>${c.name}</b><br><span style="color:var(--ink-dim);font-size:.75rem">${c.id}</span></td>
      <td>€${c.price}</td>
      <td>${c.seats} seats · ${c.gearKey === 'auto' ? 'Automatic' : 'Manual'} · ${c.fuelKey}</td>
      <td>${c.stock}</td>
      <td>${remainingStock(c)}</td>
      ${isEditor() ? `<td class="tag-row">
        <button class="btn btn-outline btn-sm" data-edit="${c.id}">Edit</button>
        <button class="btn btn-outline btn-sm" data-dup="${c.id}">Duplicate</button>
        <button class="btn btn-danger btn-sm" data-del="${c.id}">Delete</button>
      </td>` : ''}
    </tr>
  `).join('') || `<tr><td colspan="8" class="empty-state">No vehicles yet.</td></tr>`;

  tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', ()=> openCarModal(carById(b.dataset.edit))));
  tbody.querySelectorAll('[data-dup]').forEach(b => b.addEventListener('click', async ()=>{
    const r = await apiPost({ action: 'duplicateCar', id: b.dataset.dup });
    if(r.success){ toast('Vehicle duplicated'); await refreshAdminData(); renderFleetRows(); }
    else toast(r.error || 'Failed');
  }));
  tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async ()=>{
    if(!confirm('Delete this vehicle? This cannot be undone.')) return;
    const r = await apiPost({ action: 'deleteCar', id: b.dataset.del });
    if(r.success){ toast('Vehicle deleted'); await refreshAdminData(); renderFleetRows(); }
    else toast(r.error || 'Failed');
  }));

  if(isEditor()){
    let dragId = null;
    tbody.querySelectorAll('tr').forEach(row=>{
      row.addEventListener('dragstart', ()=>{ dragId = row.dataset.id; row.classList.add('dragging'); });
      row.addEventListener('dragend', ()=> row.classList.remove('dragging'));
      row.addEventListener('dragover', e => e.preventDefault());
      row.addEventListener('drop', async ()=>{
        if(!dragId || dragId === row.dataset.id) return;
        const ids = sorted.map(c=>c.id);
        const from = ids.indexOf(dragId), to = ids.indexOf(row.dataset.id);
        ids.splice(to, 0, ids.splice(from, 1)[0]);
        const updates = ids.map((id, i) => ({ ...carById(id), sortOrder: i }));
        for(const car of updates) await apiPost({ action: 'saveCar', car });
        toast('Order updated');
        await refreshAdminData();
        renderFleetRows();
      });
    });
  }
}
async function handleBulkCsv(e){
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  const [headerLine, ...lines] = text.trim().split('\n');
  const cols = headerLine.split(',').map(s=>s.trim());
  let count = 0;
  for(const line of lines){
    if(!line.trim()) continue;
    const vals = line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
    const car = {};
    cols.forEach((c,i)=> car[c] = vals[i]);
    if(car.body) car.body = car.body.split('|').filter(Boolean);
    if(!car.id || !car.name) continue;
    await apiPost({ action: 'saveCar', car });
    count++;
  }
  toast(`Imported ${count} vehicles`);
  await refreshAdminData();
  renderFleetRows();
}
function fileToWebpDataUrl(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/webp', 0.75));
    }; img.onerror = reject; img.src = reader.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    document.getElementById('cfImgSrc').value = dataUrl;
    toast('Photo ready — click Save to apply');

    const id = isNew ? document.getElementById('cfId').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-') : car.id;

async function adjustStock(id, delta){
  const car = carById(id);
  const newStock = Math.max(0, (Number(car.stock)||0) + delta);
  const r = await apiPost({ action: 'saveCar', car: { ...car, stock: newStock } });
  if(r.success){ await refreshAdminData(); renderInventory(); }
}

/* ---- Fleet Units: internal per-vehicle registry (nickname/plate/VIN/status/notes) ---- */
const FLEET_UNIT_STATUSES = [
  { value: 'available', label: 'Available', pill: 'pill-green' },
  { value: 'reserved', label: 'Reserved', pill: 'pill-blue' },
  { value: 'rented', label: 'Rented', pill: 'pill-red' },
  { value: 'maintenance', label: 'Maintenance', pill: 'pill-gray' },
];
function fleetUnitStatusMeta(status){
  return FLEET_UNIT_STATUSES.find(s => s.value === status) || FLEET_UNIT_STATUSES[0];
}
/* Real, live booking status for one specific unit — unlike the manually-set
   Status dropdown above (which the owner has to remember to update by hand),
   this is computed directly from actual reservations linked to this unit's
   unitId, so it always reflects reality without any manual upkeep. */
function liveUnitBookingLabel(unitId){
  const now = new Date();
  const bookingsForUnit = state.bookings.filter(b => b.unitId === unitId);
  const active = bookingsForUnit.find(b => new Date(b.pickup) <= now && now <= new Date(b.ret));
  if(active) return { text: `Booked until ${fmtDate(active.ret)}`, pill: 'pill-red' };
  const upcoming = bookingsForUnit
    .filter(b => new Date(b.pickup) > now)
    .sort((a, b) => new Date(a.pickup) - new Date(b.pickup))[0];
  if(upcoming) return { text: `Free — next booking ${fmtDate(upcoming.pickup)}`, pill: 'pill-blue' };
  return { text: 'Free', pill: 'pill-green' };
}
function renderFleetUnitsTable(filterText){
  const tbody = document.getElementById('fleetUnitsTableBody');
  if(!tbody) return;
  const q = (filterText || '').trim().toLowerCase();
  const units = state.fleetUnits
    .filter(u => !q || u.nickname.toLowerCase().includes(q) || u.plate.toLowerCase().includes(q))
    .slice()
    .sort((a,b)=> (carById(a.carId)?.name || '').localeCompare(carById(b.carId)?.name || ''));
  tbody.innerHTML = units.map(u => {
    const car = carById(u.carId);
    const meta = fleetUnitStatusMeta(u.status);
    const live = liveUnitBookingLabel(u.unitId);
    return `<tr>
      <td><b>${car ? car.name : u.carId}</b></td>
      <td>${u.nickname || '—'}</td>
      <td>${u.plate || '—'}</td>
      <td>${u.fleetId || '—'}</td>
      <td>${u.vin || '—'}</td>
      <td>${isEditor()
        ? `<select class="fleet-unit-status-select" data-unit="${u.unitId}">${FLEET_UNIT_STATUSES.map(s=>`<option value="${s.value}" ${s.value===u.status?'selected':''}>${s.label}</option>`).join('')}</select>`
        : `<span class="pill ${meta.pill}">${meta.label}</span>`}</td>
      <td><span class="pill ${live.pill}">${live.text}</span></td>
      <td>${u.notes || '—'}</td>
      ${isEditor() ? `<td class="tag-row">
        <button class="btn btn-outline btn-sm" data-edit-unit="${u.unitId}">Edit</button>
        <button class="btn btn-danger btn-sm" data-del-unit="${u.unitId}">Delete</button>
      </td>` : ''}
    </tr>`;
  }).join('') || `<tr><td colspan="9" class="empty-state">${q ? 'No matching units.' : 'No fleet units yet — add one to start tracking individual vehicles.'}</td></tr>`;

  if(isEditor()){
    tbody.querySelectorAll('.fleet-unit-status-select').forEach(sel => sel.addEventListener('change', async ()=>{
      const unit = state.fleetUnits.find(u => u.unitId === sel.dataset.unit);
      if(!unit) return;
      const r = await apiPost({ action: 'saveFleetUnit', unit: { ...unit, status: sel.value } });
      if(r.success){ toast('Status updated'); await refreshAdminData(); renderFleetUnitsTable(document.getElementById('fleetUnitSearch')?.value); }
      else toast(r.error || 'Failed');
    }));
    tbody.querySelectorAll('[data-edit-unit]').forEach(b => b.addEventListener('click', ()=>
      openFleetUnitModal(state.fleetUnits.find(u => u.unitId === b.dataset.editUnit))));
    tbody.querySelectorAll('[data-del-unit]').forEach(b => b.addEventListener('click', async ()=>{
      if(!confirm('Delete this fleet unit? This only removes it from your internal registry — it does not affect stock counts or bookings.')) return;
      const r = await apiPost({ action: 'deleteFleetUnit', unitId: b.dataset.delUnit });
      if(r.success){ toast('Unit deleted'); await refreshAdminData(); renderFleetUnitsTable(document.getElementById('fleetUnitSearch')?.value); }
      else toast(r.error || 'Failed');
    }));
  }
}

/* Converts an ISO date string (as returned by the backend for a booking's
   pickup/return) into the "YYYY-MM-DDTHH:MM" format the custom date-picker
   inputs use, in the browser's local time — matching how fmtDate() already
   displays these same values elsewhere in the dashboard. */
function toDatetimeLocalInputValue(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ================= CALENDAR ================= */
let calMode = 'month';
let calDate = new Date();
function renderCalendar(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="toolbar-row">
      <div class="tabs" style="margin:0;border:none">
        <button data-mode="month" class="${calMode==='month'?'active':''}">Monthly</button>
        <button data-mode="week" class="${calMode==='week'?'active':''}">Weekly</button>
        <button data-mode="day" class="${calMode==='day'?'active':''}">Daily</button>
      </div>
      <div class="tag-row">
        <button class="btn btn-outline btn-sm" id="calPrev">← Prev</button>
        <button class="btn btn-outline btn-sm" id="calToday">Today</button>
        <button class="btn btn-outline btn-sm" id="calNext">Next →</button>
      </div>
    </div>
    <div class="card card-pad" id="calBody"></div>
  `;
  root.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', ()=>{ calMode = b.dataset.mode; renderCalendar(); }));
  document.getElementById('calPrev').addEventListener('click', ()=> shiftCal(-1));
  document.getElementById('calNext').addEventListener('click', ()=> shiftCal(1));
  document.getElementById('calToday').addEventListener('click', ()=>{ calDate = new Date(); renderCalendarBody(); });
  renderCalendarBody();
}
function shiftCal(dir){
  const d = new Date(calDate);
  if(calMode==='month') d.setMonth(d.getMonth()+dir);
  else if(calMode==='week') d.setDate(d.getDate()+7*dir);
  else d.setDate(d.getDate()+dir);
  calDate = d;
  renderCalendarBody();
}
function bookingsOn(day){
  return state.bookings.filter(b=>{
    const p = new Date(b.pickup), r = new Date(b.ret);
    return day >= new Date(p.getFullYear(),p.getMonth(),p.getDate()) && day <= new Date(r.getFullYear(),r.getMonth(),r.getDate());
  });
}
function dayCellHtml(day){
  const items = bookingsOn(day);
  const isToday = day.toDateString() === new Date().toDateString();
  return `<div style="border:1px solid var(--card-border);border-radius:8px;min-height:90px;padding:6px;${isToday?'background:var(--accent-dim)':''}">
    <div style="font-size:.72rem;font-weight:700;color:var(--ink-dim);margin-bottom:4px">${day.getDate()}</div>
    ${items.slice(0,3).map(b=>{
      const st = bookingStatus(b);
      return `<div class="pill ${st.cls}" style="display:block;margin-bottom:3px;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${b.customerName||'—'} · ${b.carName||''}</div>`;
    }).join('')}
    ${items.length>3 ? `<div style="font-size:.68rem;color:var(--ink-dim)">+${items.length-3} more</div>` : ''}
  </div>`;
}
function renderCalendarBody(){
  const el = document.getElementById('calBody');
  if(calMode === 'month'){
    const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(calDate.getFullYear(), calDate.getMonth()+1, 0).getDate();
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += `<div></div>`;
    for(let d=1; d<=daysInMonth; d++) cells += dayCellHtml(new Date(calDate.getFullYear(), calDate.getMonth(), d));
    el.innerHTML = `<h4 style="margin-top:0">${calDate.toLocaleString('en-GB',{month:'long',year:'numeric'})}</h4>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${cells}</div>`;
  } else if(calMode === 'week'){
    const start = new Date(calDate); start.setDate(start.getDate() - start.getDay());
    let cells = '';
    for(let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); cells += dayCellHtml(d); }
    el.innerHTML = `<h4 style="margin-top:0">Week of ${start.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}</h4>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${cells}</div>`;
  } else {
    const items = bookingsOn(calDate);
    el.innerHTML = `<h4 style="margin-top:0">${calDate.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</h4>
      ${items.length ? items.map(b=>{
        const st = bookingStatus(b);
        return `<div class="card-pad" style="border:1px solid var(--card-border);border-radius:8px;margin-bottom:8px"><b>${b.customerName}</b> — ${b.carName} <span class="pill ${st.cls}">${st.label}</span><br><span style="color:var(--ink-dim);font-size:.78rem">${fmtDate(b.pickup)} → ${fmtDate(b.ret)}</span></div>`;
      }).join('') : `<div class="empty-state">No bookings this day.</div>`}`;
  }
}

/* ================= CUSTOMERS ================= */
function renderCustomers(){
  const byPhone = {};
  state.bookings.forEach(b=>{
    const key = b.phone || b.customerName || 'unknown';
    if(!byPhone[key]) byPhone[key] = { name: b.customerName, phone: b.phone, bookings: 0, lastDate: b.pickup };
    byPhone[key].bookings++;
    if(new Date(b.pickup) > new Date(byPhone[key].lastDate)) byPhone[key].lastDate = b.pickup;
  });
  const customers = Object.values(byPhone).sort((a,b)=> b.bookings - a.bookings);
  document.getElementById('viewRoot').innerHTML = `
    <div class="section-note">Customers are derived from your booking history (grouped by phone number) — there's no separate customer database yet.</div>
    <div class="card"><div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Phone</th><th># Bookings</th><th>Last booking</th></tr></thead>
        <tbody>
          ${customers.map(c => `<tr><td>${c.name||'—'}</td><td>${c.phone||'—'}</td><td>${c.bookings}</td><td>${fmtDate(c.lastDate)}</td></tr>`).join('')
            || `<tr><td colspan="4" class="empty-state">No customers yet.</td></tr>`}
        </tbody>
      </table>
    </div></div>
  `;
}

/* ================= PRICING ================= */
function renderPricing(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="tabs">
      <button data-tab="seasonal" class="active">Seasonal &amp; special periods</button>
      <button data-tab="currency">Currency</button>
    </div>
    <div id="pricingTabBody"></div>
  `;
  root.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{
    root.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderPricingTab(b.dataset.tab);
  }));
  renderPricingTab('seasonal');
}
function renderPricingTab(tab){
  const el = document.getElementById('pricingTabBody');
  if(tab === 'seasonal'){
    el.innerHTML = `
      <div class="section-note">Covers Summer, Holidays, Christmas, weekend surcharges or any special event — each period applies a % or fixed € adjustment to every car's daily price automatically when the pickup date falls inside it.</div>
      ${isEditor() ? `<div class="card card-pad" style="margin-bottom:20px">
        <b>Add a pricing period</b>
        <div class="field-grid" style="margin-top:12px">
          <div class="field"><label>Name</label><input id="spName" placeholder="Summer, Christmas, Weekend…"></div>
          <div class="field"><label>Type</label><select id="spType"><option value="percent">% increase</option><option value="fixed">Fixed € / day</option></select></div>
          <div class="field"><label>Start date</label><input type="date" id="spStart"></div>
          <div class="field"><label>End date</label><input type="date" id="spEnd"></div>
          <div class="field"><label>Value</label><input type="number" id="spValue" placeholder="e.g. 20"></div>
        </div>
        <button class="btn btn-primary" id="spAdd">Add period</button>
      </div>` : ''}
      <div class="card"><div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Start</th><th>End</th><th>Adjustment</th>${isEditor() ? '<th></th>' : ''}</tr></thead>
          <tbody>
            ${state.seasons.map(s => `<tr><td>${s.name}</td><td>${s.start}</td><td>${s.end}</td><td>${s.type==='fixed' ? '+€'+s.value+'/day' : '+'+s.value+'%'}</td>
              ${isEditor() ? `<td><button class="btn btn-danger btn-sm" data-del-season="${s.row}">Delete</button></td>` : ''}</tr>`).join('')
              || `<tr><td colspan="5" class="empty-state">No pricing periods yet.</td></tr>`}
          </tbody>
        </table>
      </div></div>
    `;
    if(isEditor()){
      document.getElementById('spAdd').addEventListener('click', async ()=>{
        const name = document.getElementById('spName').value.trim();
        const start = document.getElementById('spStart').value;
        const end = document.getElementById('spEnd').value;
        const value = document.getElementById('spValue').value;
        const type = document.getElementById('spType').value;
        if(!name || !start || !end || !value){ toast('Fill in all fields'); return; }
        const r = await apiPost({ action: 'addSeason', name, start, end, value, type });
        if(r.success){ toast('Period added'); await refreshAdminData(); renderPricingTab('seasonal'); }
        else toast(r.error || 'Failed');
      });
      el.querySelectorAll('[data-del-season]').forEach(b => b.addEventListener('click', async ()=>{
        const r = await apiPost({ action: 'deleteSeason', row: b.dataset.delSeason });
        if(r.success){ toast('Period removed'); await refreshAdminData(); renderPricingTab('seasonal'); }
      }));
    }
  } else {
    el.innerHTML = `
      <div class="card card-pad">
        <b>Live exchange rates</b>
        <p style="color:var(--ink-dim);font-size:.82rem">The website converts EUR prices to MAD/USD live using <code>frankfurter.app</code> (free, no API key). Booking totals and the PDF invoice always stay in EUR — the agency's real transaction currency.</p>
        <div id="fxRates" style="font-size:1.1rem;font-weight:700;margin-top:10px">Loading rates…</div>
      </div>
    `;
    fetch('https://api.frankfurter.app/latest?from=EUR&to=MAD,USD').then(r=>r.json()).then(d=>{
      document.getElementById('fxRates').textContent = `1 EUR = ${d.rates.MAD} MAD = ${d.rates.USD} USD`;
    }).catch(()=>{ document.getElementById('fxRates').textContent = 'Rates unavailable right now (offline?).'; });
  }
}

/* ================= CATEGORIES ================= */
function renderCategories(){
  const fixedCats = [
    ['All Cars', 'Always matches'], ['Petrol & Hybrid', 'fuelKey = essence or hybride'], ['Diesel', 'fuelKey = diesel'],
    ['Manual', 'gearKey = manual'], ['Automatic', 'gearKey = auto'], ['SUV', "'suv' tag on the vehicle"],
    ['7 Seats', 'seats = 7'], ['Luxury', "'luxury' tag on the vehicle"], ['Economy', 'price ≤ 25€/day'],
  ];
  document.getElementById('viewRoot').innerHTML = `
    <div class="section-note">The 9 fleet filters on the live site are computed automatically from each vehicle's specs — there's no separate category list to manage. "SUV" and "Luxury" are the only two manually-assigned tags (edit them per vehicle from Fleet Management).</div>
    <div class="card"><div class="table-wrap">
      <table><thead><tr><th>Category</th><th>How it's matched</th></tr></thead>
      <tbody>${fixedCats.map(([n,d])=>`<tr><td><b>${n}</b></td><td style="color:var(--ink-dim)">${d}</td></tr>`).join('')}</tbody></table>
    </div></div>
  `;
}

/* ================= REPORTS ================= */
function renderReports(){
  const revenue = state.bookings.reduce((s,b)=> s + (parseFloat(b.total) || 0), 0);
  const bySource = {};
  state.bookings.forEach(b => { bySource[b.source||'website'] = (bySource[b.source||'website']||0) + 1; });
  const popularity = {};
  state.bookings.forEach(b => { popularity[b.carId] = (popularity[b.carId]||0) + 1; });
  const popularSorted = Object.entries(popularity).sort((a,b)=>b[1]-a[1]).slice(0,5);

  document.getElementById('viewRoot').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Total bookings</div><div class="value">${state.bookings.length}</div></div>
      <div class="kpi"><div class="label">Revenue (active)</div><div class="value">€${revenue.toFixed(0)}</div></div>
      <div class="kpi"><div class="label">Fleet models</div><div class="value">${state.cars.length}</div></div>
    </div>
    <div class="card">
      <div class="card-pad">
        <div class="toolbar-row"><b>Most popular vehicles</b>
          <div class="tag-row">
            <button class="btn btn-outline btn-sm" id="exportBookingsCsv">⬇ Bookings CSV</button>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Vehicle</th><th>Bookings</th></tr></thead>
          <tbody>${popularSorted.map(([id,count])=>{ const c = carById(id); return `<tr><td>${c ? c.name : id}</td><td>${count}</td></tr>`; }).join('') || `<tr><td colspan="2" class="empty-state">No data yet.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="card-pad">
        <b>Bookings by source</b>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Source</th><th>Count</th></tr></thead>
          <tbody>${Object.entries(bySource).map(([s,c])=>`<tr><td>${s}</td><td>${c}</td></tr>`).join('') || `<tr><td colspan="2" class="empty-state">No data yet.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
  `;
  document.getElementById('exportBookingsCsv').addEventListener('click', ()=> csvDownload('bookings.csv', state.bookings));
}

/* ================= NOTIFICATIONS ================= */
function renderNotifications(){
  document.getElementById('viewRoot').innerHTML = `
    <div class="card card-pad">
      <div class="toolbar-row"><b>Email</b><span class="pill pill-green">Active</span></div>
      <p style="color:var(--ink-dim);font-size:.83rem">Every new booking (website or manual) automatically sends a confirmation email to <b>${state.settings.notification_email || 'the agency inbox'}</b> via the booking backend. No setup needed.</p>
    </div>
    <div class="card card-pad">
      <div class="toolbar-row"><b>WhatsApp</b><span class="pill pill-green">Ready</span></div>
      <p style="color:var(--ink-dim);font-size:.83rem">The website's booking confirmation and every "Book Now" button already deep-link to WhatsApp with a pre-filled message — no extra setup needed on your side.</p>
    </div>
    <div class="card card-pad">
      <div class="toolbar-row"><b>Push notifications</b><span class="pill pill-red">Not available</span></div>
      <p style="color:var(--ink-dim);font-size:.83rem">Browser push notifications need a push server and a service worker running on the live site — that infrastructure isn't set up yet. Email + WhatsApp cover new-booking alerts in the meantime.</p>
    </div>
  `;
}

/* ================= SETTINGS ================= */
function renderSettings(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="tabs">
      <button data-stab="seo" class="active">SEO</button>
      <button data-stab="roles">Admin roles</button>
      <button data-stab="log">Activity log</button>
      <button data-stab="backup">Backups</button>
    </div>
    <div id="settingsTabBody"></div>
  `;
  root.querySelectorAll('[data-stab]').forEach(b=> b.addEventListener('click', ()=>{
    root.querySelectorAll('[data-stab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderSettingsTab(b.dataset.stab);
  }));
  renderSettingsTab('seo');
}
function renderSettingsTab(tab){
  const el = document.getElementById('settingsTabBody');
  if(tab === 'seo'){
    el.innerHTML = `
      <div class="section-note">These override the meta title/description the live site shows to Google and social previews — applied at runtime, no code changes needed.</div>
      <div class="card card-pad">
        <div class="field"><label>Meta title</label><input id="seoTitle" value="${state.settings.meta_title||''}" placeholder="Leave blank to keep the site's default title"></div>
        <div class="field"><label>Meta description</label><textarea id="seoDesc" rows="3" placeholder="Leave blank to keep the site's default description">${state.settings.meta_description||''}</textarea></div>
        <div class="field"><label>Schema.org business type</label><input value="AutoRental" disabled>
          <span style="font-size:.72rem;color:var(--ink-dim)">Structured data is defined in index.html's JSON-LD block — edit the code directly for structural changes (this dashboard only overrides the title/description text).</span>
        </div>
        ${isEditor() ? `<button class="btn btn-primary" id="seoSave">Save SEO settings</button>` : ''}
      </div>
    `;
    if(isEditor()){
      document.getElementById('seoSave').addEventListener('click', async ()=>{
        await apiPost({ action:'saveSetting', key:'meta_title', value: document.getElementById('seoTitle').value });
        await apiPost({ action:'saveSetting', key:'meta_description', value: document.getElementById('seoDesc').value });
        toast('SEO settings saved');
        await refreshAdminData();
      });
    }
  } else if(tab === 'roles'){
    el.innerHTML = `
      <div class="section-note warn">Passwords are set in the Apps Script code (ADMIN_ROLES), not editable from here — change them in the backend if needed, then redeploy.</div>
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>Role</th><th>Can do</th></tr></thead>
        <tbody>
          <tr><td><span class="pill pill-blue">Super Admin</span></td><td>Full access to every module. Currently the only role in use — one shared password for the whole team.</td></tr>
        </tbody>
      </table></div>
      <div class="card-pad" style="color:var(--ink-dim);font-size:.8rem">The dashboard's code still supports splitting this into separate Manager/Employee roles with restricted access later — just add more entries to ADMIN_ROLES in the backend if that's ever needed.</div>
      </div>
    `;
  } else if(tab === 'log'){
    el.innerHTML = `
      <div class="card"><div class="table-wrap"><table>
        <thead><tr><th>When</th><th>Role</th><th>Action</th><th>Details</th></tr></thead>
        <tbody>${state.activityLog.map(l=>`<tr><td>${fmtDate(l.timestamp)}</td><td><span class="pill pill-gray">${l.role}</span></td><td>${l.action}</td><td>${l.details||''}</td></tr>`).join('')
          || `<tr><td colspan="4" class="empty-state">No activity recorded yet.</td></tr>`}</tbody>
      </table></div></div>
    `;
  } else {
    el.innerHTML = `
      <div class="section-note">One-click exports of your current data — a simple, reliable stand-in for scheduled server backups.</div>
      <div class="card card-pad tag-row">
        <button class="btn btn-outline" id="bkCars">⬇ Export Cars (CSV)</button>
        <button class="btn btn-outline" id="bkBookings">⬇ Export Bookings (CSV)</button>
        <button class="btn btn-outline" id="bkSeasons">⬇ Export Seasons (CSV)</button>
        <button class="btn btn-primary" id="bkAll">⬇ Full backup (JSON)</button>
      </div>
    `;
    document.getElementById('bkCars').addEventListener('click', ()=> csvDownload('cars-backup.csv', state.cars.map(c=>({...c, body:(c.body||[]).join(',')}))));
    document.getElementById('bkBookings').addEventListener('click', ()=> csvDownload('bookings-backup.csv', state.bookings));
    document.getElementById('bkSeasons').addEventListener('click', ()=> csvDownload('seasons-backup.csv', state.seasons));
    document.getElementById('bkAll').addEventListener('click', ()=> jsonDownload('afc-full-backup-' + new Date().toISOString().slice(0,10) + '.json', state));
  }
}
</script>
