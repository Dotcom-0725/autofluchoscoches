<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord admin — Auto Fluchos Coches</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --sidebar:#14161a; --sidebar-text:#a7acb8; --sidebar-text-active:#fff;
  --card:#ffffff; --card-border:#e5e7eb; --ink:#14161a; --ink-dim:#6b7280;
  --accent:#1f6feb; --accent-dim:rgba(31,111,235,.1); --gold:#c8860d;
  --danger:#e5484d; --success:#12a150; --warn:#c8860d;
  --radius:10px; --font:'Inter',sans-serif;
  --shadow:0 1px 2px rgba(20,24,43,.04), 0 1px 6px rgba(20,24,43,.04);
}
:root[data-theme="dark"]{
  --bg:#0b0d10; --sidebar:#0b0d10; --sidebar-text:#8b92a3; --sidebar-text-active:#fff;
  --card:#15181d; --card-border:#262b33; --ink:#eef1f6; --ink-dim:#8b92a3;
  --accent:#3b82f6; --accent-dim:rgba(59,130,246,.15);
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --sidebar:#0b0d10; --sidebar-text:#8b92a3; --sidebar-text-active:#fff;
    --card:#15181d; --card-border:#262b33; --ink:#eef1f6; --ink-dim:#8b92a3;
    --accent:#3b82f6; --accent-dim:rgba(59,130,246,.15);
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.85rem}

/* ---- Login screen ---- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:40px;width:360px;box-shadow:var(--shadow)}
.login-card h1{font-size:1.3rem;margin:0 0 4px}
.login-card p{color:var(--ink-dim);font-size:.85rem;margin:0 0 24px}
.login-card input{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--card-border);background:var(--bg);color:var(--ink);margin-bottom:14px}
.login-card button{width:100%;padding:11px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-weight:700}
.login-error{color:var(--danger);font-size:.8rem;margin:-6px 0 12px;display:none}
.login-error.show{display:block}

/* ---- App shell ---- */
#app{display:none;min-height:100vh}
#app.ready{display:flex}
.sidebar{width:230px;flex:0 0 230px;background:var(--sidebar);min-height:100vh;display:flex;flex-direction:column;padding:20px 0}
.sidebar-brand{padding:0 20px 20px;font-weight:800;color:#fff;font-size:1.05rem;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.sidebar-brand small{display:block;font-weight:500;font-size:.68rem;color:var(--sidebar-text);margin-top:2px}
.nav-list{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto}
.nav-list li button{
  width:100%;text-align:left;background:none;border:none;color:var(--sidebar-text);
  padding:10px 20px;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:10px;
}
.nav-list li button:hover{color:#fff}
.nav-list li button.active{color:var(--sidebar-text-active);background:rgba(255,255,255,.06);border-inline-start:3px solid var(--accent)}
.sidebar-footer{padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.role-badge{font-size:.68rem;font-weight:700;color:#fff;background:var(--accent);display:inline-block;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;width:fit-content}
.sidebar-footer button{background:none;border:1px solid rgba(255,255,255,.15);color:var(--sidebar-text);border-radius:8px;padding:7px 10px;font-size:.78rem;font-weight:600}
.sidebar-footer button:hover{color:#fff}

main{flex:1;min-width:0;padding:28px 34px;max-width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
.topbar h2{margin:0;font-size:1.35rem}
.topbar .sub{color:var(--ink-dim);font-size:.82rem;margin-top:2px}
.topbar-title-row{display:flex;align-items:center;gap:12px}
.sidebar-toggle-btn{display:none;background:none;border:1px solid var(--card-border);color:var(--ink);border-radius:8px;width:38px;height:38px;font-size:1.1rem;align-items:center;justify-content:center;flex:0 0 auto}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:150}
.sidebar-backdrop.open{display:block}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:20px}
.card-pad{padding:20px 22px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.kpi .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);font-weight:700}
.kpi .value{font-size:1.7rem;font-weight:800;margin-top:6px}
.kpi .sub{font-size:.76rem;color:var(--ink-dim);margin-top:4px}

table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;color:var(--ink-dim);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--card-border)}
td{padding:11px 14px;border-bottom:1px solid var(--card-border);vertical-align:middle}
tr:last-child td{border-bottom:none}
/* overflow:auto on both axes (not just overflow-x) so this becomes the
   scrolling ancestor sticky headers stick to - mixing overflow-x:auto with
   overflow-y:visible doesn't work, the CSS spec forces the visible axis to
   auto too in that case, which breaks position:sticky silently. */
.table-wrap{overflow:auto;max-height:70vh}
.table-wrap thead th{position:sticky;top:0;background:var(--card);z-index:5}
.sortable-th{cursor:pointer;user-select:none;white-space:nowrap}
.sortable-th:hover{color:var(--accent)}

.btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--card-border);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:6px 11px;font-size:.74rem;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:700}
.pill-blue{background:var(--accent-dim);color:var(--accent)}
.pill-green{background:rgba(18,161,80,.12);color:var(--success)}
.pill-red{background:rgba(229,72,77,.12);color:var(--danger)}
.pill-gray{background:rgba(107,114,128,.12);color:var(--ink-dim)}
.payment-status-select{
  padding:5px 8px;border-radius:7px;border:1px solid var(--card-border);
  background:var(--card);color:var(--ink);font-size:.76rem;font-weight:600;
}

.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:.72rem;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{padding:9px 12px;border-radius:8px;border:1px solid var(--card-border);background:var(--bg);color:var(--ink)}
.field-check{flex-direction:row;align-items:center;gap:8px}

.modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:26px}
.modal-box h3{margin:0 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

/* Custom calendar popup for the manual-reservation Pickup/Return fields —
   mirrors the customer-facing site's picker (same booked-day shading logic,
   fed from the same live bookings data) so the admin sees exactly the same
   availability the website would show, preventing any mismatch between
   manual and online reservations for the same vehicle. */
.custom-datepicker{
  position:absolute;z-index:900;background:var(--card);border:1px solid var(--card-border);
  border-radius:14px;box-shadow:var(--shadow);padding:14px;width:266px;
}
.custom-datepicker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.custom-datepicker-header .cdp-label{font-weight:800;font-size:.88rem}
.custom-datepicker-header button{
  background:var(--bg);border:1px solid var(--card-border);color:var(--ink);
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.85rem;line-height:1;
}
.custom-datepicker-header button:hover{border-color:var(--accent);color:var(--accent)}
.custom-datepicker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.custom-datepicker-grid .cdp-dow{color:var(--ink-dim);font-weight:700;font-size:.68rem;padding:4px 0;text-transform:uppercase}
.custom-datepicker-grid button{
  background:none;border:none;padding:7px 0;border-radius:8px;cursor:pointer;color:var(--ink);font-size:.8rem;
}
.custom-datepicker-grid button:hover:not(:disabled){background:var(--bg)}
.custom-datepicker-grid button.cdp-selected{background:var(--accent);color:#fff;font-weight:700}
.custom-datepicker-grid button.cdp-other-month{color:var(--ink-dim);opacity:.4}
.custom-datepicker-grid button:disabled{opacity:.25;cursor:not-allowed}
.custom-datepicker-grid button.cdp-booked{
  background:rgba(230,57,80,.12);color:#c81e3a;text-decoration:line-through;
  opacity:1;cursor:not-allowed;
}
.custom-datepicker-grid button.cdp-booked:hover{background:rgba(230,57,80,.12)}
.custom-datepicker-grid button.cdp-booked.cdp-other-month{opacity:.35}
.custom-datepicker-time{
  display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--card-border);
}
.custom-datepicker-time input{
  flex:1;min-width:0;padding:8px 10px;border-radius:9px;border:1px solid var(--card-border);
  background:var(--bg);color:var(--ink);font-size:.82rem;
}
.custom-datepicker-done{
  width:100%;margin-top:12px;padding:8px;border-radius:9px;border:none;
  background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;cursor:pointer;
}
input[data-custom-picker]{cursor:pointer}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-dim)}
.section-note{background:var(--accent-dim);color:var(--accent);border-radius:8px;padding:10px 14px;font-size:.78rem;margin-bottom:16px}
.section-note.warn{background:rgba(200,134,13,.12);color:var(--warn)}
.toolbar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--card-border)}
.tabs button{background:none;border:none;padding:9px 4px;margin-inline-end:20px;font-weight:700;color:var(--ink-dim);border-bottom:2px solid transparent;font-size:.82rem}
.tabs button.active{color:var(--accent);border-color:var(--accent)}
.thumb{width:56px;height:40px;object-fit:cover;border-radius:6px;background:var(--bg)}
.drag-handle{cursor:grab;color:var(--ink-dim)}
tr.dragging{opacity:.4}
.toast{position:fixed;bottom:20px;inset-inline-end:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:9px;font-size:.82rem;font-weight:600;z-index:900;box-shadow:var(--shadow)}
@media (max-width:900px){
  .sidebar{position:fixed;z-index:200;top:0;left:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .sidebar-toggle-btn{display:flex}
  main{padding:20px;width:100%}
  .field-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginScreen">
  <form class="login-card" id="loginForm">
    <h1>Auto Fluchos Coches</h1>
    <p>Tableau de bord admin — connectez-vous avec votre mot de passe administrateur.</p>
    <input type="password" id="loginPassword" placeholder="Mot de passe" autofocus required>
    <p class="login-error" id="loginError">Mot de passe incorrect.</p>
    <button type="submit" id="loginSubmitBtn">Se connecter</button>
  </form>
</div>

<div id="app">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">AUTO FLUCHOS <span style="color:#5b9bff">COCHES</span><small>ADMIN DASHBOARD</small></div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-footer">
      <span class="role-badge" id="roleBadge">—</span>
      <button type="button" id="darkModeToggle">🌙 Mode sombre</button>
      <button type="button" id="logoutBtn">Déconnexion</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div class="topbar-title-row">
        <button type="button" id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Menu">☰</button>
        <div>
          <h2 id="pageTitle">Tableau de bord</h2>
          <div class="sub" id="pageSub"></div>
        </div>
      </div>
      <a href="index.html" class="btn btn-outline" target="_blank">Voir le site en ligne ↗</a>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- jsPDF: used only to generate the downloadable/printable reservation PDF client-side, no backend involved -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxKZk3f58C67EZArO4uLRSu7chg3soBBgIBQYNOq3-NXUkoZ0--82S5NgS7ccWbiuOi/exec';

const state = { password: null, role: null, cars: [], bookings: [], seasons: [], settings: {}, activityLog: [], fleetUnits: [] };

const NAV = [
  { id: 'dashboard', label: 'Tableau de bord', icon: '📊' },
  { id: 'fleet', label: 'Gestion de la flotte', icon: '🚗' },
  { id: 'inventory', label: 'Inventaire', icon: '📦' },
  { id: 'reservations', label: 'Réservations', icon: '📋' },
  { id: 'calendar', label: 'Calendrier', icon: '📅' },
  { id: 'customers', label: 'Clients', icon: '👥' },
  { id: 'pricing', label: 'Tarification', icon: '💶' },
  { id: 'categories', label: 'Catégories', icon: '🏷️' },
  { id: 'reports', label: 'Rapports', icon: '📈' },
  { id: 'notifications', label: 'Notifications', icon: '🔔' },
  { id: 'settings', label: 'Paramètres', icon: '⚙️' },
];
const EDITOR_ROLES = ['super_admin', 'manager'];
let currentView = 'dashboard';

/* ---------------- API helpers ---------------- */
async function apiGet(params){
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(APPS_SCRIPT_URL + '?' + qs);
  return res.json();
}
async function apiPost(body){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ password: state.password }, body)),
  });
  return res.json();
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function isEditor(){ return EDITOR_ROLES.includes(state.role); }
/* Every table/list render below builds its HTML with template-literal string
   concatenation + innerHTML — convenient, but any customer-supplied field
   dropped in raw (name, phone, nationality... anything typed into the public
   booking form) becomes a stored-XSS hole: a booking named
   <img src=x onerror=...> would execute in the admin's own logged-in session
   the moment this dashboard renders it. Wrap every such field in esc()
   before interpolating it. */
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtDate(v){
  if(!v) return '—';
  const d = new Date(v);
  if(isNaN(d)) return String(v).slice(0,16).replace('T',' ');
  return d.toLocaleString('fr-FR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
/* WhatsApp has no API for sending an automatic message to a number just
   because it was entered at checkout — that's a WhatsApp Business API
   (Meta Cloud API / Twilio) restriction, not something this app can work
   around. The only notification-free option is a wa.me deep link that opens
   a pre-filled chat for a human (the admin) to review and send — so this is
   a one-click convenience, not an automatic notification like the Telegram/
   email ones above. */
function openWhatsAppLink(b){
  const phone = String(b.phone || '').replace(/[^\d+]/g, '').replace(/^\+/, '');
  if(!phone){ toast('Aucun numéro de téléphone pour ce client'); return; }
  const text = `Bonjour ${b.customerName || ''}, concernant votre réservation ${b.ref || ''} (${b.carName || ''}) : prise en charge le ${fmtDate(b.pickup)}, retour le ${fmtDate(b.ret)}.`;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
}
function csvDownload(filename, rows){
  if(!rows.length){ toast('Rien à exporter'); return; }
  const cols = Object.keys(rows[0]);
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [cols.join(','), ...rows.map(r => cols.map(c => esc(r[c])).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function jsonDownload(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* ---------------- Auth ---------------- */
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmitBtn');
  errorEl.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Connexion…';

  // A network/CORS failure (blocked request, ad-blocker, offline, etc.) throws
  // before ever reaching the server — that is NOT the same as a wrong password,
  // so retry once automatically, then show an accurate message either way
  // instead of a misleading "Wrong password".
  let result = await apiGetAdmin(password);
  if(result.networkError) result = await apiGetAdmin(password);

  submitBtn.disabled = false;
  submitBtn.textContent = 'Se connecter';

  if(result.networkError){
    errorEl.textContent = "Impossible de contacter le serveur — ce n'est pas un mot de passe incorrect. Vérifiez votre connexion internet, ou désactivez tout bloqueur de publicité/extension de confidentialité pour ce site (certains bloquent les URL de Google Apps Script), puis réessayez.";
    errorEl.classList.add('show');
    return;
  }
  if(!result.data || !result.data.success){
    errorEl.textContent = 'Mot de passe incorrect.';
    errorEl.classList.add('show');
    return;
  }
  state.password = password;
  applyAdminData(result.data);
  try { sessionStorage.setItem('afc_admin_pw', password); } catch(e){}
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('ready');
  buildSidebar();
  navigate('dashboard');
});
async function apiGetAdmin(password){
  try { return { data: await apiGet({ action: 'admin', password }) }; }
  catch(e){ return { networkError: true }; }
}
function applyAdminData(data){
  state.role = data.role;
  state.cars = data.cars || [];
  state.bookings = data.bookings || [];
  state.seasons = data.seasons || [];
  state.settings = data.settings || {};
  state.activityLog = data.activityLog || [];
  state.fleetUnits = data.fleetUnits || [];
}
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  try { sessionStorage.removeItem('afc_admin_pw'); } catch(e){}
  location.reload();
});

/* Auto-login if a password is already stored in this tab's session */
(async ()=>{
  let saved = null;
  try { saved = sessionStorage.getItem('afc_admin_pw'); } catch(e){}
  if(!saved) return;
  let result = await apiGetAdmin(saved);
  if(result.networkError) result = await apiGetAdmin(saved);
  if(result.data && result.data.success){
    state.password = saved;
    applyAdminData(result.data);
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('ready');
    buildSidebar();
    navigate('dashboard');
  }
})();

async function refreshAdminData(){
  const result = await apiGetAdmin(state.password);
  if(result.data && result.data.success) applyAdminData(result.data);
  else if(result.networkError) toast("Actualisation impossible — problème de connexion, affichage des dernières données chargées.");
}

/* ---------------- Dark mode ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('afc_admin_theme', t); } catch(e){}
}
(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('afc_admin_theme'); } catch(e){}
  if(saved) applyTheme(saved);
})();
document.getElementById('darkModeToggle').addEventListener('click', ()=>{
  const current = document.documentElement.getAttribute('data-theme') ||

function buildSidebar(){
  const list = document.getElementById('navList');
  list.innerHTML = NAV.map(n => `<li><button data-view="${n.id}">${n.icon} ${n.label}</button></li>`).join('');

  inventory: ['Inventaire', 'Niveaux de stock + registre interne de la flotte (surnoms, plaques, VIN, statut)'],

    pricing: renderPricing, categories: renderCategories, reports: renderReports,
    notifications: renderNotifications, settings: renderSettings,
  };

}

/* ---------------- Shared helpers ---------------- */
function bookingStatus(b){
  if(b.bookingStatus === 'cancelled') return { label: 'Annulée', cls: 'pill-red' };
  const now = new Date();
  const ret = new Date(b.ret);
  const pickup = new Date(b.pickup);
  if(ret < now) return { label: 'En retard', cls: 'pill-red' };
  if(pickup <= now && now <= ret) return { label: 'En cours', cls: 'pill-green' };
  return { label: 'À venir', cls: 'pill-blue' };
}
function carById(id){ return state.cars.find(c => c.id === id); }
/* Bookings that actually occupy a car/unit right now — excludes cancelled
   ones (bookingStatus === 'cancelled'), which the backend keeps as
   permanent history instead of deleting (see the `cancel` action in
   apps-script.gs.txt) but which must never keep blocking availability.
   Every stock/overlap/day-shading check below reads from this instead of
   raw state.bookings; only the Reservations table, Customers list, Reports,
   and CSV exports intentionally still use state.bookings directly, since
   those are meant to show the full history including cancellations. */
function occupyingBookings(){
  return state.bookings.filter(b => b.bookingStatus !== 'cancelled');
}
function remainingStock(car){
  const booked = occupyingBookings().filter(b => b.carId === car.id).length;
  return Math.max(0, (Number(car.stock) || 1) - booked);
}

// Mandatory turnaround time between one booking's return and the next
// booking's pickup for the SAME car — mirrors the backend's
// CAR_TURNAROUND_BUFFER_MS exactly (see apps-script.gs.txt), so the admin
// dashboard never disagrees with what the backend will actually enforce.
const CAR_TURNAROUND_BUFFER_MS_ADMIN = 2 * 60 * 60 * 1000;
/* True if [startA,endA) conflicts with [startB,endB) once the mandatory
   CAR_TURNAROUND_BUFFER_MS_ADMIN gap is required between one range's end and
   the other's start — same interval-overlap test the website's booking
   engine uses, so "is this car free for these dates" agrees exactly between
   the admin dashboard and the public site. */
function rangesOverlapAdmin(startA, endA, startB, endB){
  return new Date(startB).getTime() < new Date(endA).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN &&
         new Date(startA).getTime() < new Date(endB).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN;
}
function getOverlapCountAdmin(carId, pickupVal, retVal, excludeRow){
  const bookingsPool = excludeRow ? occupyingBookings().filter(b => b.row !== excludeRow) : occupyingBookings();
  return bookingsPool.filter(b => b.carId === carId && rangesOverlapAdmin(pickupVal, retVal, b.pickup, b.ret)).length;
}
/* The earliest moment AT OR AFTER `afterMs` (on the SAME calendar day) that
   `carId` has fewer than `stock` units busy — deliberately NOT the same
   question getEarliestAvailableTimeOnDayAdmin answers (that one finds the
   day's globally earliest free moment, for the date-picker's click-to-select
   auto-suggest, where there's no "requested time" yet to respect). This one
   only considers candidates from `afterMs` onward, so an unrelated free gap
   EARLIER in the day never gets offered as a "later" rescue for a request
   that's already past it. Returns null if no such moment exists that day. */
function getEarliestAvailableTimeAfterAdmin_(carId, afterMs, stock, excludeRow){
  const dayStart = new Date(new Date(afterMs).getFullYear(), new Date(afterMs).getMonth(), new Date(afterMs).getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  const bookingsPool = (excludeRow ? occupyingBookings().filter(b => b.row !== excludeRow) : occupyingBookings())
    .filter(b => b.carId === carId);
  const intervals = bookingsPool
    .map(b => ({ start: new Date(b.pickup).getTime() - CAR_TURNAROUND_BUFFER_MS_ADMIN, end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN }))
    .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
  const candidates = intervals.map(iv => iv.end).filter(t => t >= afterMs && t < dayEnd.getTime());
  candidates.sort((a, b) => a - b);
  for(const t of candidates){
    if(intervals.filter(iv => iv.start <= t && t < iv.end).length < stock) return new Date(t);
  }
  return null;
}
/* Mirrors index.html's getDelayedAvailability exactly (available / delayed /
   unavailable three-state check) for the aggregate stock-count model — used
   for cars that have NO fleet units registered yet (see
   renderUnitAvailabilityAdmin below), so the manual/edit reservation modals
   give the exact same "available now" / "available from HH:MM" / "sold out"
   feedback the public site already gives for such cars, instead of the
   admin only finding out a conflict exists after Save fails against the
   backend's own check with no explanation. */
function getDelayedAvailabilityAdmin(car, pickupVal, retVal, excludeRow){
  if(!pickupVal || !retVal) return { status: 'unknown' };
  const stock = Number(car.stock) || 1;
  const overlap = getOverlapCountAdmin(car.id, pickupVal, retVal, excludeRow);
  if(overlap < stock) return { status: 'available', remaining: stock - overlap };
  const [pickupDateStr] = pickupVal.split('T');
  const earliest = getEarliestAvailableTimeAfterAdmin_(car.id, new Date(pickupVal).getTime(), stock, excludeRow);
  if(!earliest) return { status: 'unavailable' }; // no later rescue slot that day
  const pad = n => String(n).padStart(2, '0');
  const earliestTimeStr = `${pad(earliest.getHours())}:${pad(earliest.getMinutes())}`;
  const delayedPickup = `${pickupDateStr}T${earliestTimeStr}`;
  const delayedOverlap = getOverlapCountAdmin(car.id, delayedPickup, retVal, excludeRow);
  if(delayedOverlap < stock) return { status: 'delayed', remaining: stock - delayedOverlap, earliestTimeStr, pickupDateStr };
  return { status: 'unavailable' };
}
/* True if this car has NO valid moment left to pick on this calendar day.
   When this car has real units registered (plate/fleet ID, entered in the
   Inventory > Fleet Units screen), the admin already has full visibility into
   which unit each booking is assigned to (state.bookings[].unitId) — so
   shading here can be EXACT: the day is only fully booked once every
   registered unit is still busy at every candidate moment, not just a bare
   count. Cars with no units registered yet fall back to the count-vs-stock
   check. */
function isDayFullyBookedAdmin(carId, cellDate, excludeRow){
  const car = carById(carId);
  if(!car) return false;
  const dayStart = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  // Each existing booking blocks [pickup - buffer, return + buffer) — buffer
  // applies on BOTH sides (mirrors rangesOverlapAdmin's bidirectional check
  // for a zero-length candidate instant), not just after the return.
  // Previously this only inspected the day's LAST minute to decide whether
  // the whole day should be disabled, which correctly widened a day that
  // starts booked and frees up later, but wrongly blacked out an entire day
  // when a booking only starts partway through it (e.g. pickup at 18:00 left
  // the 00:00–16:00 morning showing as unavailable). The fix scans every
  // moment where the busy count can hit a new low — the start of the day,
  // and each interval's end+buffer — since those are the only points a
  // previously fully-busy day can become free again.
  const bookingsPool = excludeRow ? occupyingBookings().filter(b => b.row !== excludeRow) : occupyingBookings();
  const units = state.fleetUnits.filter(u => u.carId === carId);
  if(units.length > 0){
    const intervals = bookingsPool
      .filter(b => b.carId === carId)
      .map(b => ({ start: new Date(b.pickup).getTime() - CAR_TURNAROUND_BUFFER_MS_ADMIN, end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN, unitId: b.unitId }))
      .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
    const candidates = [dayStart.getTime(), ...intervals.map(iv => iv.end).filter(t => t > dayStart.getTime() && t < dayEnd.getTime())];
    return !candidates.some(t => {
      const active = intervals.filter(iv => iv.start <= t && t < iv.end);
      const assignedUnitIds = active.filter(iv => iv.unitId).map(iv => iv.unitId);
      const legacyCount = active.filter(iv => !iv.unitId).length;
      const freeUnits = units.filter(u => assignedUnitIds.indexOf(u.unitId) === -1);
      return freeUnits.length > legacyCount;
    });
  }
  const stock = Number(car.stock) || 1;
  const intervals = bookingsPool
    .filter(b => b.carId === carId)
    .map(b => ({ start: new Date(b.pickup).getTime() - CAR_TURNAROUND_BUFFER_MS_ADMIN, end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN }))
    .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
  const candidates = [dayStart.getTime(), ...intervals.map(iv => iv.end).filter(t => t > dayStart.getTime() && t < dayEnd.getTime())];
  return !candidates.some(t => intervals.filter(iv => iv.start <= t && t < iv.end).length < stock);
}

/* ================= CUSTOM DATE PICKER (manual reservation modal) =================
   Mirrors the customer-facing site's calendar popup — same booked-day shading,
   fed from the same state.bookings data — so admins see exactly the same
   availability a website visitor would see for that vehicle. */
const ADMIN_MONTH_NAMES = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const ADMIN_WEEKDAY_MIN = ['Di','Lu','Ma','Me','Je','Ve','Sa'];
let activeAdminDatePicker = null;
function closeAdminDatePicker(){ if(activeAdminDatePicker){ activeAdminDatePicker.remove(); activeAdminDatePicker = null; } }
document.addEventListener('click', e=>{
  if(activeAdminDatePicker && !activeAdminDatePicker.contains(e.target) && !e.target.closest('input[data-custom-picker]')){
    closeAdminDatePicker();
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeAdminDatePicker(); });
function parseAdminDateValue(input){
  const v = input.value;
  if(v){
    const [datePart, timePart] = v.split('T');
    const [y, m, d] = datePart.split('-').map(Number);
    return { date: new Date(y, m - 1, d), time: timePart || '10:00' };
  }
  return { date: new Date(), time: '10:00' };
}
function writeAdminDateValue(input, date, time){
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  input.value = `${dateStr}T${time}`;
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
/* The earliest bookable time on `cellDate` for `carId`, accounting for the
   mandatory CAR_TURNAROUND_BUFFER_MS_ADMIN after any booking's return — e.g.
   a car returning at 10:00 with a 2h buffer becomes bookable at 12:00 THAT
   SAME DAY. Mirrors index.html's getEarliestAvailableTimeOnDay exactly, but
   reads state.bookings (already fully loaded in the admin dashboard) instead
   of the public site's remoteBookedIntervals. */
function getEarliestAvailableTimeOnDayAdmin(carId, cellDate, excludeRow){
  const dayStart = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  const car = carById(carId);
  if(!car) return dayStart;
  const stock = Number(car.stock) || 1;
  const bookingsPool = (excludeRow ? occupyingBookings().filter(b => b.row !== excludeRow) : occupyingBookings())
    .filter(b => b.carId === carId);
  // Buffer applies on BOTH sides of each existing booking (see
  // isDayFullyBookedAdmin above) — a candidate pickup time must also leave
  // room for the mandatory turnaround before any UPCOMING booking, not just
  // clear of a past one's return.
  const events = bookingsPool
    .map(b => ({ start: new Date(b.pickup).getTime() - CAR_TURNAROUND_BUFFER_MS_ADMIN, end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN }))
    .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
  const candidates = [dayStart.getTime(), ...events.map(iv => iv.end).filter(t => t > dayStart.getTime() && t < dayEnd.getTime())];
  candidates.sort((a, b) => a - b);
  for(const t of candidates){
    const activeCount = events.filter(iv => iv.start <= t && t < iv.end).length;
    if(activeCount < stock) return new Date(t);
  }
  return dayStart;
}
/* Same "earliest free moment that day" scan as getEarliestAvailableTimeOnDayAdmin,
   but scoped to ONE specific physical unit instead of the whole car model —
   only the admin dashboard lets the agency pick a specific unit at all, so
   this is the unit-level equivalent needed to reuse that exact algorithm for
   it. A legacy booking with no unitId on the same car is conservatively
   treated as possibly occupying this very unit, so this never wrongly
   reports a unit free earlier than it might actually be. */
function getEarliestAvailableTimeForUnitAdmin(unitId, carId, cellDate, excludeRow){
  const dayStart = new Date(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  const bookingsPool = (excludeRow ? occupyingBookings().filter(b => b.row !== excludeRow) : occupyingBookings())
    .filter(b => b.carId === carId && (b.unitId === unitId || !b.unitId));
  // Buffer applies on BOTH sides of each existing booking — see
  // isDayFullyBookedAdmin above.
  const events = bookingsPool
    .map(b => ({ start: new Date(b.pickup).getTime() - CAR_TURNAROUND_BUFFER_MS_ADMIN, end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN }))
    .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
  const candidates = [dayStart.getTime(), ...events.map(iv => iv.end).filter(t => t > dayStart.getTime() && t < dayEnd.getTime())];
  candidates.sort((a, b) => a - b);
  for(const t of candidates){
    const stillBusy = events.some(iv => iv.start <= t && t < iv.end);
    if(!stillBusy) return new Date(t);
  }
  return dayStart;
}
/* Mirrors index.html's getDelayedAvailability exactly (available / delayed /
   unavailable three-state check), just scoped to one specific unit instead
   of the whole car's aggregate stock. "delayed" is purely informational,
   same as on the public site — the Save button stays enabled, and the
   backend's own findAvailableUnitForBooking_ re-validates the exact chosen
   unit at submit time regardless, so a genuine conflict is only ever
   actually blocked there, never here. */
function getDelayedAvailabilityForUnitAdmin(unitId, carId, pickupVal, retVal, excludeRow){
  if(!pickupVal || !retVal) return { status: 'unknown' };
  const bookingsPool = (excludeRow ? occupyingBookings().filter(b => b.row !== excludeRow) : occupyingBookings())
    .filter(b => b.carId === carId && (b.unitId === unitId || !b.unitId));
  const conflict = bookingsPool.some(b => rangesOverlapAdmin(pickupVal, retVal, b.pickup, b.ret));
  if(!conflict) return { status: 'available' };
  const [pickupDateStr] = pickupVal.split('T');
  const dayStart = new Date(new Date(pickupVal).getFullYear(), new Date(pickupVal).getMonth(), new Date(pickupVal).getDate());
  const dayEnd = new Date(dayStart); dayEnd.setDate(dayEnd.getDate() + 1);
  const afterMs = new Date(pickupVal).getTime();
  // Same "only candidates AT OR AFTER the requested time" fix as
  // getEarliestAvailableTimeAfterAdmin_ above — an unrelated free gap
  // EARLIER in the day must never be offered as a "later" rescue.
  const events = bookingsPool
    .map(b => ({ start: new Date(b.pickup).getTime() - CAR_TURNAROUND_BUFFER_MS_ADMIN, end: new Date(b.ret).getTime() + CAR_TURNAROUND_BUFFER_MS_ADMIN }))
    .filter(iv => iv.end > dayStart.getTime() && iv.start < dayEnd.getTime());
  const candidates = events.map(iv => iv.end).filter(t => t >= afterMs && t < dayEnd.getTime());
  candidates.sort((a, b) => a - b);
  let earliestMs = null;
  for(const t of candidates){
    if(!events.some(iv => iv.start <= t && t < iv.end)){ earliestMs = t; break; }
  }
  if(earliestMs == null) return { status: 'unavailable' }; // no later rescue slot that day
  const pad = n => String(n).padStart(2, '0');
  const earliest = new Date(earliestMs);
  const earliestTimeStr = `${pad(earliest.getHours())}:${pad(earliest.getMinutes())}`;
  const delayedPickup = `${pickupDateStr}T${earliestTimeStr}`;
  const stillConflict = bookingsPool.some(b => rangesOverlapAdmin(delayedPickup, retVal, b.pickup, b.ret));
  if(!stillConflict) return { status: 'delayed', earliestTimeStr, pickupDateStr };
  return { status: 'unavailable' };
}
/* Shared by the manual-reservation and edit-reservation modals: always lists
   EVERY registered unit for the car (never narrowed to only currently-free
   ones, and never silently swapped out from under the admin), and shows a
   "this unit will be available from HH:MM" note for whichever unit is
   actually selected — same delayed-availability UX as the public site's
   booking form, just per-unit. The admin has full control over the unit
   choice at all times; only the informational note and Save/Create button's
   disabled state react to availability. */
function renderUnitAvailabilityAdmin({ carId, pickup, ret, excludeRow, unitSelect, note, saveBtn, defaultUnitId }){
  const car = carById(carId);
  const unitField = unitSelect.closest('.field');
  if(!car){
    if(unitField) unitField.style.display = 'none';
    note.textContent = '';
    if(saveBtn) saveBtn.disabled = false;
    return;
  }
  const allUnits = state.fleetUnits.filter(u => u.carId === car.id);
  if(!allUnits.length){
    if(unitField) unitField.style.display = 'none';
    const hasDates = !!(pickup && ret);
    if(!hasDates){
      note.textContent = `${car.name} a ${car.stock || 1} unité(s) au total (aucune plaque enregistrée dans Unités de flotte — la disponibilité est estimée par le nombre) — choisissez la prise en charge et le retour.`;
      if(saveBtn) saveBtn.disabled = false;
      return;
    }
    const availability = getDelayedAvailabilityAdmin(car, pickup, ret, excludeRow);
    if(availability.status === 'available'){
      note.textContent = `${car.name} disponible pour ces dates (${availability.remaining} unité(s) restante(s)).`;
      if(saveBtn) saveBtn.disabled = false;
    } else if(availability.status === 'delayed'){
      const [y, m, d] = availability.pickupDateStr.split('-');
      note.textContent = `${car.name} sera disponible à partir de ${availability.earliestTimeStr} le ${d}/${m}/${y}. Ajustez l'heure de prise en charge ci-dessus, ou continuez et nous la confirmerons à cette heure.`;
      if(saveBtn) saveBtn.disabled = false;
    } else {
      note.textContent = `${car.name} n'est pas disponible pour ces dates.`;
      if(saveBtn) saveBtn.disabled = true;
    }
    return;
  }
  if(unitField) unitField.style.display = '';
  const previousSelection = unitSelect.value || defaultUnitId || allUnits[0].unitId;
  unitSelect.innerHTML = allUnits.map(u=>{
    const sel = u.unitId === previousSelection ? 'selected' : '';
    return `<option value="${u.unitId}" ${sel}>${u.plate || u.nickname || u.unitId}${u.nickname && u.plate ? ' — ' + u.nickname : ''}</option>`;
  }).join('');
  const chosenUnitId = unitSelect.value;
  const chosenUnit = allUnits.find(u => u.unitId === chosenUnitId);
  const label = chosenUnit ? (chosenUnit.plate || chosenUnit.nickname || chosenUnit.unitId) : chosenUnitId;
  const hasDates = !!(pickup && ret);
  if(!hasDates){
    note.textContent = `${car.name} a ${allUnits.length} unité(s) enregistrée(s) — choisissez celle à assigner, puis la prise en charge et le retour.`;
    if(saveBtn) saveBtn.disabled = false;
    return;
  }
  const availability = getDelayedAvailabilityForUnitAdmin(chosenUnitId, car.id, pickup, ret, excludeRow);
  if(availability.status === 'available'){
    note.textContent = `Unité ${label} disponible pour ces dates.`;
    if(saveBtn) saveBtn.disabled = false;
  } else if(availability.status === 'delayed'){
    const [y, m, d] = availability.pickupDateStr.split('-');
    note.textContent = `Cette unité (${label}) sera disponible à partir de ${availability.earliestTimeStr} le ${d}/${m}/${y}. Ajustez l'heure de prise en charge ci-dessus, ou continuez et nous la confirmerons à cette heure.`;
    if(saveBtn) saveBtn.disabled = false;
  } else {
    note.textContent = `Cette unité (${label}) n'est pas disponible pour ces dates.`;
    if(saveBtn) saveBtn.disabled = true;
  }
}
/* Builds the same "not available — available from HH:MM on DD/MM/YYYY"
   explanation the inline preview note already shows (see
   renderUnitAvailabilityAdmin above), for use wherever a booking gets
   REJECTED — a sold_out response from the backend at Save time, or the
   pre-save unit check — instead of a bare "no stock" message that leaves
   the admin to guess when the car frees up. Reuses whichever check applies:
   per-unit when the car has registered fleet units, aggregate stock
   otherwise — same rule renderUnitAvailabilityAdmin uses. */
function buildUnavailableMessageAdmin(car, unitId, pickup, ret, excludeRow){
  const allUnits = state.fleetUnits.filter(u => u.carId === car.id);
  const availability = (allUnits.length && unitId)
    ? getDelayedAvailabilityForUnitAdmin(unitId, car.id, pickup, ret, excludeRow)
    : getDelayedAvailabilityAdmin(car, pickup, ret, excludeRow);
  if(availability.status === 'delayed'){
    const [y, m, d] = availability.pickupDateStr.split('-');
    return `${car.name} n'est pas disponible pour cet horaire — disponible à partir de ${availability.earliestTimeStr} le ${d}/${m}/${y}.`;
  }
  return `${car.name} n'est pas disponible pour ces dates — consultez le calendrier (jours grisés) pour une date libre.`;
}
function openAdminDatePicker(input, carId, excludeRow){
  closeAdminDatePicker();
  const { date: selected, time: initialTime } = parseAdminDateValue(input);
  let viewYear = selected.getFullYear();
  let viewMonth = selected.getMonth();
  let currentTime = initialTime;

  const popup = document.createElement('div');
  popup.className = 'custom-datepicker';
  document.body.appendChild(popup);
  activeAdminDatePicker = popup;

  function render(){
    popup.innerHTML = '';
    const header = document.createElement('div');
    header.className = 'custom-datepicker-header';
    const prevBtn = document.createElement('button');
    prevBtn.type = 'button'; prevBtn.textContent = '‹';
    const label = document.createElement('span');
    label.className = 'cdp-label';
    label.textContent = `${ADMIN_MONTH_NAMES[viewMonth]} ${viewYear}`;
    const nextBtn = document.createElement('button');
    nextBtn.type = 'button'; nextBtn.textContent = '›';
    header.appendChild(prevBtn); header.appendChild(label); header.appendChild(nextBtn);
    popup.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'custom-datepicker-grid';
    ADMIN_WEEKDAY_MIN.forEach(dow=>{
      const el = document.createElement('div');
      el.className = 'cdp-dow';
      el.textContent = dow;
      grid.appendChild(el);
    });
    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const startOffset = firstOfMonth.getDay();
    const gridStart = new Date(viewYear, viewMonth, 1 - startOffset);
    for(let i = 0; i < 42; i++){
      const cellDate = new Date(gridStart);
      cellDate.setDate(gridStart.getDate() + i);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = cellDate.getDate();
      if(cellDate.getMonth() !== viewMonth) btn.classList.add('cdp-other-month');
      if(cellDate.toDateString() === selected.toDateString()) btn.classList.add('cdp-selected');
      if(carId && isDayFullyBookedAdmin(carId, cellDate, excludeRow)){
        btn.classList.add('cdp-booked');
        btn.disabled = true;
        btn.title = 'Complet pour ce véhicule';
      }
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        let timeToUse = currentTime || '10:00';
        // Picking the pickup day auto-suggests the earliest moment THAT DAY
        // the car is actually free (its last return + the mandatory
        // turnaround buffer), matching the website's own booking form,
        // instead of a generic default time that would just get rejected.
        if(carId && (input.id === 'mbPickup' || input.id === 'ebPickup')){
          const earliest = getEarliestAvailableTimeOnDayAdmin(carId, cellDate, excludeRow);
          const pad = n => String(n).padStart(2, '0');
          timeToUse = `${pad(earliest.getHours())}:${pad(earliest.getMinutes())}`;
          currentTime = timeToUse;
        }
        writeAdminDateValue(input, cellDate, timeToUse);
        selected.setFullYear(cellDate.getFullYear(), cellDate.getMonth(), cellDate.getDate());
        render();
      });
      grid.appendChild(btn);
    }
    popup.appendChild(grid);

    const timeRow = document.createElement('div');
    timeRow.className = 'custom-datepicker-time';
    const timeInput = document.createElement('input');
    timeInput.type = 'time';
    timeInput.value = currentTime || '10:00';
    timeInput.addEventListener('change', ()=>{
      currentTime = timeInput.value;
      writeAdminDateValue(input, selected, currentTime);
    });
    timeRow.appendChild(timeInput);
    popup.appendChild(timeRow);

    const doneBtn = document.createElement('button');
    doneBtn.type = 'button';
    doneBtn.className = 'custom-datepicker-done';
    doneBtn.textContent = 'Terminé';
    doneBtn.addEventListener('click', closeAdminDatePicker);
    popup.appendChild(doneBtn);

    prevBtn.addEventListener('click', e=>{ e.stopPropagation(); viewMonth--; if(viewMonth < 0){ viewMonth = 11; viewYear--; } render(); });
    nextBtn.addEventListener('click', e=>{ e.stopPropagation(); viewMonth++; if(viewMonth > 11){ viewMonth = 0; viewYear++; } render(); });
  }
  render();

  const rect = input.getBoundingClientRect();
  const top = window.scrollY + rect.bottom + 6;
  let left = window.scrollX + rect.left;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 280;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

async function handleBulkCsv(e){
  const file = e.target.files[0];
  if(!file) return;
  const text = await file.text();
  const [headerLine, ...lines] = text.trim().split('\n');
  const cols = headerLine.split(',').map(s=>s.trim());
  let count = 0;
  for(const line of lines){
    if(!line.trim()) continue;
    const vals = line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
    const car = {};
    cols.forEach((c,i)=> car[c] = vals[i]);
    if(car.body) car.body = car.body.split('|').filter(Boolean);
    if(!car.id || !car.name) continue;
    await apiPost({ action: 'saveCar', car });
    count++;
  }
  toast(`${count} véhicules importés`);
  await refreshAdminData();
  renderFleetRows();
}
function fileToWebpDataUrl(file, maxWidth){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/webp', 0.75));
    }; img.onerror = reject; img.src = reader.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---- Fleet Units: internal per-vehicle registry (nickname/plate/VIN/status/notes) ---- */
const FLEET_UNIT_STATUSES = [
  { value: 'available', label: 'Disponible', pill: 'pill-green' },
  { value: 'reserved', label: 'Réservée', pill: 'pill-blue' },
  { value: 'rented', label: 'Louée', pill: 'pill-red' },
  { value: 'maintenance', label: 'Maintenance', pill: 'pill-gray' },
];
function fleetUnitStatusMeta(status){
  return FLEET_UNIT_STATUSES.find(s => s.value === status) || FLEET_UNIT_STATUSES[0];
}
/* Real, live booking status for one specific unit — unlike the manually-set
   Status dropdown above (which the owner has to remember to update by hand),
   this is computed directly from actual reservations linked to this unit's
   unitId, so it always reflects reality without any manual upkeep. */
function liveUnitBookingLabel(unitId){
  const now = new Date();
  const bookingsForUnit = occupyingBookings().filter(b => b.unitId === unitId);
  const active = bookingsForUnit.find(b => new Date(b.pickup) <= now && now <= new Date(b.ret));
  if(active) return { text: `Réservée jusqu'au ${fmtDate(active.ret)}`, pill: 'pill-red' };
  const upcoming = bookingsForUnit
    .filter(b => new Date(b.pickup) > now)
    .sort((a, b) => new Date(a.pickup) - new Date(b.pickup))[0];
  if(upcoming) return { text: `Libre — prochaine réservation ${fmtDate(upcoming.pickup)}`, pill: 'pill-blue' };
  return { text: 'Libre', pill: 'pill-green' };
}

  tbody.innerHTML = units.map(u => {

    const meta = fleetUnitStatusMeta(u.status);
    const live = liveUnitBookingLabel(u.unitId);
    return `<tr>

const LEGAL_FOOTER_TEXT = 'RC : 29173 - Pattente : 51405048 - ICE : 002803339000014';

function imageUrlToPngDataUrlAdmin(url, { maxWidth = 500, format = 'image/jpeg', quality = 0.82 } = {}){
  return new Promise((resolve)=>{
    if(!url){ resolve(null); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxWidth / img.naturalWidth);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        const ctx = canvas.getContext('2d');
        if(format === 'image/jpeg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL(format, quality));
      } catch(e){ resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
function formatDateTimeForPdfAdmin(value){
  if(!value) return '';
  const d = new Date(value);
  if(isNaN(d)) return String(value);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${dd}-${mm}-${d.getFullYear()} ${hh}:${mi}`;
}
/* jsPDF's built-in fonts have no Arabic glyphs — customer names/nationalities
   entered via the Arabic version of the public site render as mojibake
   otherwise. Rasterizes Arabic text onto an offscreen canvas (browser's own
   text engine shapes/joins the letters correctly) and places it as an image;
   Latin text keeps normal vector jsPDF text. Mirrors index.html exactly. */
function containsArabicTextAdmin(str){
  return /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/.test(str);
}
function rasterizeArabicTextAdmin(text, { bold=false, sizePt=9.5, color=[20,20,20] } = {}){
  const scale = 3;
  const sizePx = sizePt * (96 / 72) * scale;
  const fontSpec = `${bold ? '700' : '400'} ${sizePx}px Cairo, sans-serif`;
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = fontSpec;
  measure.direction = 'rtl';
  const metrics = measure.measureText(text);
  const ascent = metrics.actualBoundingBoxAscent || sizePx * 0.8;
  const descent = metrics.actualBoundingBoxDescent || sizePx * 0.25;
  const width = Math.max(1, Math.ceil(metrics.width) + 4);
  const height = Math.max(1, Math.ceil(ascent + descent) + 4);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.font = fontSpec;
  ctx.direction = 'rtl';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
  ctx.fillText(text, width - 2, ascent + 2);
  const pxToMm = 25.4 / 96 / scale;
  return {
    dataUrl: canvas.toDataURL('image/png'),
    widthMm: width * pxToMm,
    heightMm: height * pxToMm,
    ascentMm: ascent * pxToMm,
  };
}
function wrapArabicTextAdmin(text, sizePt, bold, maxWidthMm){
  const scale = 3;
  const sizePx = sizePt * (96 / 72) * scale;
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = `${bold ? '700' : '400'} ${sizePx}px Cairo, sans-serif`;
  const maxWidthPx = maxWidthMm / (25.4 / 96 / scale);
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach(word=>{
    const candidate = current ? current + ' ' + word : word;
    if(current && ctx.measureText(candidate).width > maxWidthPx){
      lines.push(current);
      current = word;
    } else {
      current = candidate;
    }
  });
  if(current) lines.push(current);
  return lines;
}
function pdfTextAdmin(doc, text, x, y, { align='left', bold=false, sizePt=9.5, color=[20,20,20], url=null } = {}){
  const str = String(text);
  if(containsArabicTextAdmin(str)){
    const { dataUrl, widthMm, heightMm, ascentMm } = rasterizeArabicTextAdmin(str, { bold, sizePt, color });
    let imgX = x;
    if(align === 'right') imgX = x - widthMm;
    else if(align === 'center') imgX = x - widthMm / 2;
    try { doc.addImage(dataUrl, 'PNG', imgX, y - ascentMm, widthMm, heightMm); } catch(e){}
    return widthMm;
  }
  doc.setFontSize(sizePt);
  doc.setFont(undefined, bold ? 'bold' : 'normal');
  doc.setTextColor(...color);
  if(url){
    doc.textWithLink(str, x, y, { url, align });
    return doc.getTextWidth(str);
  }
  doc.text(str, x, y, { align });
  return doc.getTextWidth(str);
}
function pdfTextWrappedAdmin(doc, text, x, y, maxWidthMm, lineHeightMm, opts={}){
  const str = String(text);
  const { bold=false, sizePt=9.5, color=[20,20,20] } = opts;
  if(containsArabicTextAdmin(str)){
    const lines = wrapArabicTextAdmin(str, sizePt, bold, maxWidthMm);
    lines.forEach((line, i)=> pdfTextAdmin(doc, line, x, y + i * lineHeightMm, { align: 'left', bold, sizePt, color }));
    return lines.length;
  }
  doc.setFontSize(sizePt);
  doc.setFont(undefined, bold ? 'bold' : 'normal');
  doc.setTextColor(...color);
  const wrapped = doc.splitTextToSize(str, maxWidthMm);
  doc.text(wrapped, x, y);
  return wrapped.length;
}

  if(data.licenseUrl) bullets.push([PDF_FR.license, 'Voir le document', data.licenseUrl]);

  doc.setDrawColor(210, 210, 210);
  doc.line(marginX, rowBottom, rightX, rowBottom);
  y = rowBottom;

  const bar = (label, value) => {
    doc.setFillColor(...BLUE);
    doc.rect(marginX, y, rightX - marginX, 9, 'F');
    pdfTextAdmin(doc, label, marginX + 3, y + 6, { bold: true, sizePt: 10, color: WHITE });
    pdfTextAdmin(doc, String(value), rightX - 3, y + 6, { align: 'right', bold: true, sizePt: 10, color: WHITE });
    y += 9;
  };
  bar(PDF_FR.subtotal, data.total);
  bar(PDF_FR.total_row, data.total);
  bar(PDF_FR.payment_method, data.paymentMethodLabel || PDF_FR.payment_cash);

  y += 10;
  doc.setTextColor(...DARK);
  doc.setFontSize(9.5);
  doc.setFont(undefined, 'bolditalic');
  doc.text(LEGAL_FOOTER_TEXT, marginX, y);

  return doc;
}
/* Entry point wired to the Reservations table's "Télécharger / Imprimer"
   button — builds the same pdfData shape schedulePdfGeneration builds in
   index.html, but sourced from an already-recorded booking row (state.bookings)
   instead of a live checkout form, so it works identically whether that
   booking was placed on the website or created manually from this dashboard. */
async function downloadReservationPdf(booking){
  const car = carById(booking.carId);
  const [carImg, logoImg] = await Promise.all([
    imageUrlToPngDataUrlAdmin(car?.imgSrc, { maxWidth: 400, format: 'image/jpeg', quality: 0.8 }),
    imageUrlToPngDataUrlAdmin('images/logo.webp', { maxWidth: 200, format: 'image/png' }),
  ]);
  const pdfData = {
    ref: booking.ref || '—',
    date: fmtDate(booking.bookedAt || booking.pickup),
    name: booking.customerName || '—', phone: booking.phone || '—', nationality: booking.nationality || '',
    email: booking.email || '',
    carName: booking.carName || (car ? car.name : '—'),
    unit: unitLabelForBooking(booking) !== '—' ? unitLabelForBooking(booking) : '',
    pickup: formatDateTimeForPdfAdmin(booking.pickup), ret: formatDateTimeForPdfAdmin(booking.ret),
    pickupLoc: booking.pickupLoc || '', dropoffLoc: booking.dropoffLoc || '',
    flightNumber: booking.flightNumber || '', licenseYears: booking.licenseYears || '',
    deposit: booking.deposit || '', resources: booking.resources || '', notes: booking.notes || '',
    priceBreakdown: booking.priceBreakdown
      ? String(booking.priceBreakdown).split(' | ').map(pair => {
          const idx = pair.indexOf(': ');
          return idx === -1 ? [pair, ''] : [pair.slice(0, idx), pair.slice(idx + 2)];
        })
      : [],
    quantity: 1, total: booking.total || '—',
    licenseUrl: booking.licenseUrl || '', passportUrl: booking.passportUrl || '',
    carImg, logoImg,
    paymentMethodLabel: paymentMethodLabel(booking.paymentMethod),
  };
  const doc = await generateReservationPdfAdmin(pdfData);
  doc.save(`reservation-${booking.ref || booking.row}.pdf`);
}
/* Which specific physical unit (by plate/nickname) a booking is linked to —
   resolves booking.unitId (set automatically by the backend at booking time,
   see findAvailableUnitForBooking_) against the Fleet Units registry, so the
   owner can see at a glance which exact car is booked, not just the model. */
function unitLabelForBooking(b){
  if(!b.unitId) return '—';
  const unit = state.fleetUnits.find(u => u.unitId === b.unitId);
  if(!unit) return '—';
  return unit.plate || unit.nickname || unit.unitId;
}
function renderReservationsRows(){
  const tbody = document.getElementById('reservationsBody');
  const sortKey = reservationsSortField === 'ret' ? 'ret' : 'pickup';
  const dirMul = reservationsSortDir === 'desc' ? -1 : 1;
  const filtered = state.bookings
    .filter(b => reservationsCarFilter === 'all' || b.carId === reservationsCarFilter)
    .filter(b => reservationsUnitFilter === 'all' || b.unitId === reservationsUnitFilter);

    return `<tr>
      <td>${esc(b.ref)||'—'}</td><td>${esc(b.customerName)||'—'}</td><td>${esc(b.nationality)||'—'}</td><td>${esc(b.phone)||'—'}</td><td>${esc(b.carName)||'—'}</td>

      <td>${fmtDate(b.pickup)}</td><td>${fmtDate(b.ret)}</td><td>${esc(b.total)||'—'}</td>
      <td><span class="pill pill-gray">${esc(b.source)||'website'}</span></td>

      <td>
        <div style="font-size:.7rem;color:var(--ink-dim);margin-bottom:3px">${esc(paymentMethodLabel(b.paymentMethod))}</div>
        <select class="payment-status-select" data-ref="${esc(b.ref)}" ${b.ref ? '' : 'disabled'}>
          ${PAYMENT_STATUS_OPTIONS.map(o=> `<option value="${o.value}" ${o.value===paymentStatus?'selected':''}>${o.label}</option>`).join('')}
        </select>
      </td>
      <td class="tag-row">
        <button class="btn btn-outline btn-sm" data-edit="${b.row}">Modifier</button>
        <button class="btn btn-outline btn-sm" data-pdf="${b.row}">🖨️ PDF</button>
        <button class="btn btn-outline btn-sm" data-whatsapp="${b.row}">💬 WhatsApp</button>
        ${b.bookingStatus === 'cancelled' ? '' : `<button class="btn btn-danger btn-sm" data-cancel="${b.row}">Annuler</button>`}
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="13" class="empty-state">${
    reservationsUnitFilter !== 'all' ? 'Aucune réservation pour cette unité.'
    : reservationsCarFilter !== 'all' ? 'Aucune réservation pour ce véhicule.'
    : 'Aucune réservation pour le moment.'
  }</td></tr>`;
  tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', ()=>{
    const booking = state.bookings.find(b => String(b.row) === btn.dataset.edit);
    if(booking) openBookingEditModal(booking);
  }));
  tbody.querySelectorAll('[data-pdf]').forEach(btn => btn.addEventListener('click', async ()=>{
    const booking = state.bookings.find(b => String(b.row) === btn.dataset.pdf);
    if(!booking) return;
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = '…';
    try { await downloadReservationPdf(booking); }
    catch(e){ toast('Échec de la génération du PDF'); }
    finally { btn.disabled = false; btn.textContent = originalText; }
  }));
  tbody.querySelectorAll('[data-whatsapp]').forEach(btn => btn.addEventListener('click', ()=>{
    const booking = state.bookings.find(b => String(b.row) === btn.dataset.whatsapp);
    if(booking) openWhatsAppLink(booking);
  }));
  tbody.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', async ()=>{
    if(!confirm("Annuler cette réservation et libérer le véhicule ? Elle restera visible dans l'historique avec le statut « Annulée ».")) return;
    const r = await apiPost({ action: 'cancel', row: btn.dataset.cancel });
    if(r.success){ toast('Réservation annulée — véhicule libéré, historique conservé'); await refreshAdminData(); renderReservationsRows(); }
    else toast(r.error || 'Échec');
  }));
  tbody.querySelectorAll('.payment-status-select').forEach(sel => sel.addEventListener('change', async ()=>{
    const ref = sel.dataset.ref;
    const paymentStatus = sel.value;
    sel.disabled = true;
    const r = await apiPost({ action: 'adminSetPaymentStatus', ref, paymentStatus });
    sel.disabled = false;
    if(r.success){
      toast(paymentStatus === 'paid' ? 'Marqué comme payé — e-mail de confirmation envoyé' : 'Statut de paiement mis à jour');
      await refreshAdminData();
      renderReservationsRows();
    } else toast(r.error || 'Échec');
  }));
}

/* Converts an ISO date string (as returned by the backend for a booking's
   pickup/return) into the "YYYY-MM-DDTHH:MM" format the custom date-picker
   inputs use, in the browser's local time — matching how fmtDate() already
   displays these same values elsewhere in the dashboard. */
function toDatetimeLocalInputValue(v){
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ================= CALENDAR ================= */
let calMode = 'month';
let calDate = new Date();
function renderCalendar(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="toolbar-row">
      <div class="tabs" style="margin:0;border:none">
        <button data-mode="month" class="${calMode==='month'?'active':''}">Mensuel</button>
        <button data-mode="week" class="${calMode==='week'?'active':''}">Hebdomadaire</button>
        <button data-mode="day" class="${calMode==='day'?'active':''}">Quotidien</button>
      </div>
      <div class="tag-row">
        <button class="btn btn-outline btn-sm" id="calPrev">← Préc.</button>
        <button class="btn btn-outline btn-sm" id="calToday">Aujourd'hui</button>
        <button class="btn btn-outline btn-sm" id="calNext">Suiv. →</button>
      </div>
    </div>
    <div class="card card-pad" id="calBody"></div>
  `;
  root.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', ()=>{ calMode = b.dataset.mode; renderCalendar(); }));
  document.getElementById('calPrev').addEventListener('click', ()=> shiftCal(-1));
  document.getElementById('calNext').addEventListener('click', ()=> shiftCal(1));
  document.getElementById('calToday').addEventListener('click', ()=>{ calDate = new Date(); renderCalendarBody(); });
  renderCalendarBody();
}
function shiftCal(dir){
  const d = new Date(calDate);
  if(calMode==='month') d.setMonth(d.getMonth()+dir);
  else if(calMode==='week') d.setDate(d.getDate()+7*dir);
  else d.setDate(d.getDate()+dir);
  calDate = d;
  renderCalendarBody();
}
function bookingsOn(day){
  return state.bookings.filter(b=>{
    const p = new Date(b.pickup), r = new Date(b.ret);
    return day >= new Date(p.getFullYear(),p.getMonth(),p.getDate()) && day <= new Date(r.getFullYear(),r.getMonth(),r.getDate());
  });
}
function dayCellHtml(day){
  const items = bookingsOn(day);
  const isToday = day.toDateString() === new Date().toDateString();
  return `<div style="border:1px solid var(--card-border);border-radius:8px;min-height:90px;padding:6px;${isToday?'background:var(--accent-dim)':''}">
    <div style="font-size:.72rem;font-weight:700;color:var(--ink-dim);margin-bottom:4px">${day.getDate()}</div>
    ${items.slice(0,3).map(b=>{
      const st = bookingStatus(b);
      return `<div class="pill ${st.cls}" style="display:block;margin-bottom:3px;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.customerName)||'—'} · ${esc(b.carName)||''}</div>`;
    }).join('')}
    ${items.length>3 ? `<div style="font-size:.68rem;color:var(--ink-dim)">+${items.length-3} de plus</div>` : ''}
  </div>`;
}
function renderCalendarBody(){
  const el = document.getElementById('calBody');
  if(calMode === 'month'){
    const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(calDate.getFullYear(), calDate.getMonth()+1, 0).getDate();
    let cells = '';
    for(let i=0;i<startOffset;i++) cells += `<div></div>`;
    for(let d=1; d<=daysInMonth; d++) cells += dayCellHtml(new Date(calDate.getFullYear(), calDate.getMonth(), d));
    el.innerHTML = `<h4 style="margin-top:0">${calDate.toLocaleString('fr-FR',{month:'long',year:'numeric'})}</h4>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${cells}</div>`;
  } else if(calMode === 'week'){
    const start = new Date(calDate); start.setDate(start.getDate() - start.getDay());
    let cells = '';
    for(let i=0;i<7;i++){ const d = new Date(start); d.setDate(start.getDate()+i); cells += dayCellHtml(d); }
    el.innerHTML = `<h4 style="margin-top:0">Semaine du ${start.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})}</h4>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">${cells}</div>`;
  } else {
    const items = bookingsOn(calDate);
    el.innerHTML = `<h4 style="margin-top:0">${calDate.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</h4>
      ${items.length ? items.map(b=>{
        const st = bookingStatus(b);
        return `<div class="card-pad" style="border:1px solid var(--card-border);border-radius:8px;margin-bottom:8px"><b>${esc(b.customerName)}</b> — ${esc(b.carName)} <span class="pill ${st.cls}">${st.label}</span><br><span style="color:var(--ink-dim);font-size:.78rem">${fmtDate(b.pickup)} → ${fmtDate(b.ret)}</span></div>`;
      }).join('') : `<div class="empty-state">Aucune réservation ce jour.</div>`}`;
  }
}

/* ================= CUSTOMERS ================= */
function renderCustomers(){
  const byPhone = {};
  state.bookings.forEach(b=>{
    const key = b.phone || b.customerName || 'unknown';
    if(!byPhone[key]) byPhone[key] = { name: b.customerName, phone: b.phone, bookings: 0, lastDate: b.pickup };
    byPhone[key].bookings++;
    if(new Date(b.pickup) > new Date(byPhone[key].lastDate)) byPhone[key].lastDate = b.pickup;
  });
  const customers = Object.values(byPhone).sort((a,b)=> b.bookings - a.bookings);
  document.getElementById('viewRoot').innerHTML = `
    <div class="section-note">Les clients sont déduits de votre historique de réservations (groupés par numéro de téléphone) — il n'y a pas encore de base de données clients séparée.</div>
    <div class="card"><div class="table-wrap">
      <table>
        <thead><tr><th>Nom</th><th>Téléphone</th><th>Nb réservations</th><th>Dernière réservation</th></tr></thead>
        <tbody>
          ${customers.map(c => `<tr><td>${esc(c.name)||'—'}</td><td>${esc(c.phone)||'—'}</td><td>${c.bookings}</td><td>${fmtDate(c.lastDate)}</td></tr>`).join('')
            || `<tr><td colspan="4" class="empty-state">Aucun client pour le moment.</td></tr>`}
        </tbody>
      </table>
    </div></div>
  `;
}

/* ================= PRICING ================= */
function renderPricing(){
  const root = document.getElementById('viewRoot');
  root.innerHTML = `
    <div class="tabs">
      <button data-tab="seasonal" class="active">Périodes saisonnières et spéciales</button>
      <button data-tab="currency">Devise</button>
    </div>
    <div id="pricingTabBody"></div>
  `;
  root.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{
    root.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    renderPricingTab(b.dataset.tab);
  }));

}
function renderPricingTab(tab){
  const el = document.getElementById('pricingTabBody');
  if(tab === 'seasonal'){
    el.innerHTML = `
      <div class="section-note">Couvre l'été, les vacances, Noël, les suppléments de week-end ou tout événement spécial — chaque période applique automatiquement un ajustement en % ou en € fixe au prix journalier de chaque voiture lorsque la date de prise en charge y correspond.</div>
      ${isEditor() ? `<div class="card card-pad" style="margin-bottom:20px">
        <b>Ajouter une période tarifaire</b>
        <div class="field-grid" style="margin-top:12px">
          <div class="field"><label>Nom</label><input id="spName" placeholder="Été, Noël, Week-end…"></div>
          <div class="field"><label>Type</label><select id="spType"><option value="percent">Augmentation en %</option><option value="fixed">€ fixe / jour</option></select></div>
          <div class="field"><label>Date de début</label><input type="date" id="spStart"></div>
          <div class="field"><label>Date de fin</label><input type="date" id="spEnd"></div>
          <div class="field"><label>Valeur</label><input type="number" id="spValue" placeholder="ex. 20"></div>
        </div>
        <button class="btn btn-primary" id="spAdd">Ajouter la période</button>
      </div>` : ''}
      <div class="card"><div class="table-wrap">
        <table>
          <thead><tr><th>Nom</th><th>Début</th><th>Fin</th><th>Ajustement</th>${isEditor() ? '<th></th>' : ''}</tr></thead>
          <tbody>
            ${state.seasons.map(s => `<tr><td>${s.name}</td><td>${s.start}</td><td>${s.end}</td><td>${s.type==='fixed' ? '+€'+s.value+'/jour' : '+'+s.value+'%'}</td>
              ${isEditor() ? `<td><button class="btn btn-danger btn-sm" data-del-season="${s.row}">Supprimer</button></td>` : ''}</tr>`).join('')
              || `<tr><td colspan="5" class="empty-state">Aucune période tarifaire pour le moment.</td></tr>`}
          </tbody>
        </table>
      </div></div>
    `;
    if(isEditor()){
      document.getElementById('spAdd').addEventListener('click', async ()=>{
        const name = document.getElementById('spName').value.trim();
        const start = document.getElementById('spStart').value;
        const end = document.getElementById('spEnd').value;
        const value = document.getElementById('spValue').value;
        const type = document.getElementById('spType').value;
        if(!name || !start || !end || !value){ toast('Veuillez remplir tous les champs'); return; }
        const r = await apiPost({ action: 'addSeason', name, start, end, value, type });
        if(r.success){ toast('Période ajoutée'); await refreshAdminData(); renderPricingTab('seasonal'); }
        else toast(r.error || 'Échec');
      });
      el.querySelectorAll('[data-del-season]').forEach(b => b.addEventListener('click', async ()=>{
        const r = await apiPost({ action: 'deleteSeason', row: b.dataset.delSeason });
        if(r.success){ toast('Période supprimée'); await refreshAdminData(); renderPricingTab('seasonal'); }
      }));
    }
  } else {
    el.innerHTML = `
      <div class="card card-pad">
        <b>Taux de change en direct</b>
        <p style="color:var(--ink-dim);font-size:.82rem">Le site web convertit les prix EUR en MAD/USD en direct grâce à <code>frankfurter.app</code> (gratuit, sans clé API). Les totaux de réservation et la facture PDF restent toujours en EUR — la devise réelle des transactions de l'agence.</p>
        <div id="fxRates" style="font-size:1.1rem;font-weight:700;margin-top:10px">Chargement des taux…</div>
      </div>
    `;
    fetch('https://api.frankfurter.app/latest?from=EUR&to=MAD,USD').then(r=>r.json()).then(d=>{
      document.getElementById('fxRates').textContent = `1 EUR = ${d.rates.MAD} MAD = ${d.rates.USD} USD`;
    }).catch(()=>{ document.getElementById('fxRates').textContent = 'Taux indisponibles pour le moment (hors ligne ?).'; });
  }
}

/* ================= REPORTS ================= */
function renderReports(){
  const revenue = state.bookings.reduce((s,b)=> s + (parseFloat(b.total) || 0), 0);
  const bySource = {};
  state.bookings.forEach(b => { bySource[b.source||'website'] = (bySource[b.source||'website']||0) + 1; });
  const popularity = {};
  state.bookings.forEach(b => { popularity[b.carId] = (popularity[b.carId]||0) + 1; });
  const popularSorted = Object.entries(popularity).sort((a,b)=>b[1]-a[1]).slice(0,5);

  document.getElementById('viewRoot').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Total des réservations</div><div class="value">${state.bookings.length}</div></div>
      <div class="kpi"><div class="label">Revenus (actifs)</div><div class="value">€${revenue.toFixed(0)}</div></div>
      <div class="kpi"><div class="label">Modèles de la flotte</div><div class="value">${state.cars.length}</div></div>
    </div>
    <div class="card">
      <div class="card-pad">
        <div class="toolbar-row"><b>Véhicules les plus populaires</b>
          <div class="tag-row">
            <button class="btn btn-outline btn-sm" id="exportBookingsCsv">⬇ CSV des réservations</button>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Véhicule</th><th>Réservations</th></tr></thead>
          <tbody>${popularSorted.map(([id,count])=>{ const c = carById(id); return `<tr><td>${c ? c.name : id}</td><td>${count}</td></tr>`; }).join('') || `<tr><td colspan="2" class="empty-state">Aucune donnée pour le moment.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="card-pad">
        <b>Réservations par source</b>
        <div class="table-wrap" style="margin-top:12px"><table>
          <thead><tr><th>Source</th><th>Nombre</th></tr></thead>
          <tbody>${Object.entries(bySource).map(([s,c])=>`<tr><td>${s}</td><td>${c}</td></tr>`).join('') || `<tr><td colspan="2" class="empty-state">Aucune donnée pour le moment.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
  `;
  document.getElementById('exportBookingsCsv').addEventListener('click', ()=> csvDownload('bookings.csv', state.bookings));
}
